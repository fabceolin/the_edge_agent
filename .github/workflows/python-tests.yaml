name: Python Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'python/**'
      - 'examples/**'
      - '.github/workflows/python-tests.yaml'
  pull_request:
    paths:
      - 'python/**'
      - 'examples/**'
      - '.github/workflows/python-tests.yaml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue testing other versions if one fails
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Install graphviz for pygraphviz
        sudo apt-get install -y libgraphviz-dev graphviz
        # Install SWI-Prolog 9.x from PPA for janus-swi.
        # Bypass `add-apt-repository` (queries launchpad.net, which has flaky 504s);
        # configure source manually against ppa.launchpadcontent.net (CDN-backed).
        sudo install -d -m 0755 /etc/apt/keyrings
        curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xE8B739E3753FF4A12360BA6A4AB3A5F60EA9AEB3" \
          | sudo gpg --dearmor -o /etc/apt/keyrings/swi-prolog.gpg
        echo "deb [signed-by=/etc/apt/keyrings/swi-prolog.gpg] https://ppa.launchpadcontent.net/swi-prolog/stable/ubuntu/ $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/swi-prolog.list
        sudo apt-get update
        sudo apt-get install -y swi-prolog
        # Sanity-check: janus-swi requires >= 9.1.12 — fail loudly if PPA wasn't used
        swipl --version
        swipl_ver=$(swipl --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
        [ "$(printf '9.1.12\n%s\n' "$swipl_ver" | sort -V | head -1)" = "9.1.12" ] \
          || { echo "ERROR: SWI-Prolog $swipl_ver is older than required 9.1.12"; exit 1; }
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        cd python && pip install -e .[dev,rag-chroma,graph-kuzu,tools,secrets]
    - name: Download NLTK data
      run: |
        python -c "import nltk; nltk.download('punkt_tab', quiet=True)"
    - name: Run tests with pytest
      run: |
        cd python && pytest
