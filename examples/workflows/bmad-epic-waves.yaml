name: bmad-epic-waves
description: |
  BMad — fluxo de épico PARALELO por ondas: analisa dependências entre as stories do épico,
  deriva as ondas (paralelizando o máximo que o grafo permite), roda cada story num git worktree
  isolado, com integração (merge) e marcação de status serializada ao fim de cada onda. Quando
  o épico fecha 100%, escreve a retrospective e flippa o pseudo-key epic-N para done.

  Port direto do bmad-epic-waves.js (Claude Code Workflow tool) para tea YAML.

  Mapeamento de primitivas:
  - computeWaves() (JS, determinístico) → nó `run:` Python (port ipsis litteris).
  - parallel() fan-out por onda → execution.run mode: graph com use_worktrees:true
    (graph mode faz topológico + worktree por task + merge).
  - agent(prompt,{schema}) → llm.call codex + marcadores FINAL_STATUS/EDGE/...
  - sprint-status done no merge (serial, mergePrompt) → nó run: Python (determinístico).

  REDES DE SEGURANÇA (portadas do JS depois de incidentes reais em uso):
  - **Lock cross-run** em `<repo>/.claude/.bmad-epic-waves.lock`: duas invocações DESTE
    workflow em épicos DIFERENTES no mesmo repo disputavam a mesma árvore de trabalho
    (HEAD destacado, merge intercalado, stash de irmão). Aqui o lock é código Python
    determinístico (`mkdir` atômico + token de dono + heartbeat + roubo só quando
    comprovadamente parado), não instrução de prompt.
  - **Bloqueio cross-épico:** uma story cuja Task 0 exige story de OUTRO épico ainda não
    done não é despachada (`blocked_external_dependency`) em vez de gastar um agente que
    descobre o mesmo impedimento no meio da implementação. Requer `deps` NÃO fornecido.
  - **Elegibilidade mecânica do auto-resolve:** um conflito só vira `pending_resolution`
    se for colisão add/add pura comprovada pelos ESTÁGIOS do índice do git (1/2/3),
    insertion-only dos dois lados, sem interseção de identificadores, sem arquivo
    gerado/lock/sprint-status, e com suíte declarada. O resto é fail-closed direto.
  - **DAG de migrations:** merge textualmente limpo que deixa duas folhas de migration é
    detectado com o próprio check do framework e resolvido com o gerador dele (nunca um
    `makemigrations` pelado).
  - **Retry único** de dev/review que morrem sem produzir report (dentro do story-cycle).

  Input (--input JSON):
    arg (obrigatório): "epic-10", "10" ou 10
    repo_path (obrigatório): path absoluto do repo alvo
    only_wave (int, opcional): roda só a onda N (respeita teto de agentes)
    max_review_cycles (int, default 3)
    dev_model (str, default gpt-5.6-sol): modelo para criação, desenvolvimento e integração
    review_model (str, default gpt-5.6-sol): modelo usado no review das stories
    run_retrospective (bool, default true)
    flip_epic_status (bool, default true)
    dry_run (bool, default false): só computa e loga o plano de ondas, não executa
    stop_after_prep (bool, default false): cria as stories faltantes e para
    auto_create_stories (bool, default true)
    deps (dict, opcional): override do grafo {to: [from,...]}; pula inferência
      ⚠️ passar deps pula TAMBÉM a detecção de bloqueio cross-épico e a classificação
      de complexidade — as duas pegam carona na leitura que o agente de grafo já faz.
    reprocess_done (bool, default false)
    stop_on_wave_failure (bool, default true)
    skills_dir (str, opcional): default {repo_path}/.claude/skills
    auto_model (bool, default false): OPT-IN. O agente de grafo também classifica a
      complexidade de cada story num tier, e o dev/fix daquela story roda no esforço do
      tier em vez do default. Calibragem PRÓPRIA do codex (ver settings do
      bmad-story-cycle.yaml): como só existe um modelo configurado, o eixo é
      `model_reasoning_effort` e o default histórico já é o topo (xhigh) — ou seja,
      ligar isso só pode BARATEAR story fácil, nunca encarecer. Uma story que falha é
      repromovida um degrau e tentada de novo.
    model_tiers (dict, opcional): remapeia tier -> nome de shell_provider, ex.:
      {"trivial": "codex_small"}. Os nomes têm de existir no bmad-story-cycle.yaml.
    auto_resolve_conflicts (bool, default false): Nível 2 (LLM junta os dois lados),
      agora restrito aos conflitos que passam na elegibilidade mecânica acima.

  Uso:
    tea run examples/workflows/bmad-epic-waves.yaml \
      --input '{"arg":"epic-10","repo_path":"/home/fabricio/src/licityeasy"}'
    # Só ver o plano:
    tea run examples/workflows/bmad-epic-waves.yaml \
      --input '{"arg":"epic-10","repo_path":"...","dry_run":true}'

state_schema:
  arg: str
  repo_path: str
  epic_num: str
  epic_key: str
  max_review_cycles: int
  dev_model: str
  review_model: str
  run_retrospective: bool
  flip_epic_status: bool
  dry_run: bool
  stop_after_prep: bool
  auto_create_stories: bool
  only_wave: int
  deps: dict
  reprocess_done: bool
  stop_on_wave_failure: bool
  skills_dir: str
  epic_label: str
  communication_language: str
  document_output_language: str
  user_name: str
  test_command: str
  target_branch: str
  implementation_artifacts_dir: str
  sprint_status_path: str
  stories: list
  candidates: list
  missing_files: list
  prep_create_output: str
  reconcile_output: str
  sprint_status_intact: bool
  prep_committed: bool
  prep_head_sha: str
  graph_output: str
  graph_edges: list
  graph_analysis: str
  deps_resolved: dict
  waves: list
  wave_tasks: list
  dot_path: str
  run_waves_results: dict
  # ---- modo multi-épico + worktree por story ----
  multi_epic: bool            # True quando arg="all"/"pending"/lista de épicos
  epic_nums: list             # ex.: ["8","29"] no modo multi
  epic_keys: list             # ex.: ["epic-8","epic-29"]
  story_keys_filter: list     # subset opcional de keys a rodar (piloto controlado)
  worktrees: list             # [{key, path, branch}] criadas por build_waves
  worktree_base: str          # dir base das worktrees (default /tmp/tea-wt-<epic_key>)
  merged_ok: list             # stories mergeadas sem conflito
  merged_tips: dict            # {story_key: commit_tip} comprovados no HEAD final
  merged_branches: dict        # {story_key: branch} deletadas só após gate final verde
  merge_conflicts: list       # stories com conflito de merge (fail-closed)
  auto_resolve_conflicts: bool  # Nível 2: LLM resolve conflitos; gate = suíte verde + sem marcadores
  pending_resolution: list   # [{key, branch, files}] conflitos resolvíveis (auto_resolve on)
  post_merge_head: str       # HEAD com merged_ok, antes dos merges resolvidos (pra git reset)
  resolution_output: str     # output do resolve_conflicts (LLM)
  resolution_recovery: dict   # {story_key: recovery/ref} antes de rollback fail-closed
  marked_done: list
  all_done: bool
  done_count: int
  total_count: int
  suite_green: bool
  suite_covers_the_epic: bool
  suite_that_covers: str
  retro_output: str
  final_status: str
  # ---- redes de segurança portadas do JS ----
  lock_owner: str             # token do dono do lock cross-run (vazio = não temos o lock)
  lock_reason: str            # acquired | lock_timeout | environment
  external_blockers: list     # [{story, requires_key, requires_status, current_status, evidence}]
  blocked_stories: list       # keys excluídas do despacho por dep cross-épico não satisfeita
  auto_model: bool
  model_tiers: dict
  story_tiers: dict           # {story_key: tier} vindo da classificação
  escalations: list           # [{key, from_tier, to_tier}] promoções após falha
  run_base_head: str          # HEAD antes de qualquer merge desta run (range do épico)
  migration_fix: dict         # resultado do check/merge de DAG de migrations
  conflict_audit: dict        # {key: veredito mecânico} de cada conflito examinado
  dot_payloads: dict          # {story_key: payload} p/ remontar o comando na escalação
  tier_providers: dict        # tier -> nome de shell_provider do bmad-story-cycle
  tea_bin: str
  subgraph_path: str

settings:
  shell_providers:
    codex:
      command: codex
      args:
        - "--yolo"
        - "exec"
        - "-c"
        - "model={model}"
        - "-c"
        - "model_reasoning_effort=xhigh"
        - "-"
      stdin_mode: pipe
      verbose: true
      timeout: 108000
  # NOTA: execution.run / settings.execution NÃO existem como action no tea 0.9.108
  # (ExecutionOrchestrator existe como lib mas não está wired ao `tea run`). As ondas
  # rodam via DOT nativo: build_waves gera um .dot, run_waves chama `tea run --from-dot`.
  # Worktree por story, quando necessário, via git.worktree_create no subgraph.

nodes:
  # ============================================================================
  # DISCOVER — determinístico (porta o discover do JS epic-waves)
  # ============================================================================
  - name: discover_epic
    description: Descobre stories, langs, test_command, target_branch, impl_artifacts_dir
    run: |
      import os, re, glob, subprocess, yaml
      repo = state.get("repo_path", ".")
      os.chdir(repo) if os.path.isdir(repo) else None
      arg = str(state.get("arg", "")).strip().lower()
      # Modo multi-épico: arg in {"all","pending","*","epics"} OU lista/CSV de números.
      multi_epic = arg in ("all", "pending", "*", "epics")
      epic_nums, epic_keys = [], []
      if multi_epic:
          epic_key = "epics-all"
          epic_num = ""
      else:
          # arg pode ser "8", "epic-8", "8,29", "epic-8,epic-29"
          nums = re.findall(r'(\d+)', arg)
          if not nums: return {"final_status": "error_bad_epic_arg"}
          if len(nums) > 1:
              multi_epic = True
              epic_nums = nums
              epic_keys = [f"epic-{n}" for n in nums]
              epic_key = "epics-" + "-".join(nums)
              epic_num = ""
          else:
              epic_num, epic_key = nums[0], f"epic-{nums[0]}"

      config_paths = ["_bmad/bmm/config.yaml", ".bmad/bmm/config.yaml"]
      impl_artifacts = "_bmad-output/implementation-artifacts"
      comm_lang, doc_lang, user_name = "Português", "Português", "Fabrício"
      for cp in config_paths:
          if os.path.exists(cp):
              try:
                  cfg = yaml.safe_load(open(cp)) or {}
                  impl_artifacts = cfg.get("implementation_artifacts", impl_artifacts)
                  comm_lang = cfg.get("communication_language", comm_lang)
                  doc_lang = cfg.get("document_output_language", doc_lang)
                  user_name = cfg.get("user_name", user_name)
                  break
              except Exception: pass
      # Resolve placeholders da config ({project-root} → relativo ao repo, {repo} idem)
      for ph in ["{project-root}", "{repo}", repo]:
          impl_artifacts = impl_artifacts.replace(ph, "")
      impl_artifacts = impl_artifacts.lstrip("/") or impl_artifacts
      sprint_status_path = os.path.join(impl_artifacts, "sprint-status.yaml")

      try:
          target_branch = subprocess.check_output(["git","rev-parse","--abbrev-ref","HEAD"], cwd=repo, text=True).strip()
      except Exception:
          target_branch = "main"

      ss_full = os.path.join(repo, sprint_status_path)
      stories, epic_label = [], epic_key
      if os.path.isfile(ss_full):
          ss = yaml.safe_load(open(ss_full)) or {}
          dev_status = ss.get("development_status", {}) or {}
          # epic_prefix = primeiro segmento da key ate o primeiro '-' (ex.: "8", "td", "24")
          def _prefix(k):
              return k.split("-", 1)[0] if "-" in k else k
          # Set de épicos a considerar: no modo multi "all", todos; se epic_nums dado, só esses.
          if multi_epic:
              if epic_nums:
                  num_set = set(epic_nums)
                  def _belongs(k): return _prefix(k) in num_set
              else:
                  def _belongs(k): return True  # toda story não-pseudo pertence
          else:
              def _belongs(k): return _prefix(k) == epic_num
          # Pseudo-chaves a excluir (epic-N e epic-N-retrospective)
          def _is_pseudo(k): return bool(re.match(r'^epic-\w+(-retrospective)?$', k))
          for key, val in dev_status.items():
              if not _belongs(key): continue
              if _is_pseudo(key): continue
              status = val if isinstance(val, str) else (val.get("status") if isinstance(val, dict) else str(val))
              sp = os.path.join(repo, impl_artifacts, f"{key}.md")
              has_file = os.path.isfile(sp)
              title = key
              if has_file:
                  try:
                      h1 = re.search(r'^#\s+(.+)$', open(sp).read(1500), re.M)
                      if h1: title = h1.group(1).strip()
                  except Exception: pass
              stories.append({"key": key, "title": title, "status": (status or "").lower(), "has_story_file": has_file, "story_path": sp if has_file else "", "epic_num": _prefix(key)})
      epics_md = os.path.join(repo, "_bmad-output/planning-artifacts/epics.md")
      if os.path.isfile(epics_md) and not multi_epic:
          try:
              m2 = re.search(rf'^#+\s*.*\b{re.escape(epic_key)}\b[^\n]*', open(epics_md).read(), re.M | re.I)
              if m2: epic_label = m2.group(0).lstrip('#').strip()
          except Exception: pass
      elif multi_epic:
          _epics_seen = set()
          for s in stories:
              mm = re.match(r'^(\d+)-', s['key'])
              if mm: _epics_seen.add(mm.group(1))
          epic_label = f"epics-all ({len(_epics_seen)} epicos)" if stories else "epics-all"

      # test_command
      test_command = ""
      for tf in ["Makefile","pyproject.toml","package.json","Cargo.toml"]:
          p = os.path.join(repo, tf)
          if not os.path.isfile(p): continue
          try:
              if tf == "Makefile" and re.search(r'^test:', open(p).read(), re.M): test_command = "make test"
              elif tf == "pyproject.toml" and re.search(r'pytest', open(p).read(), re.I): test_command = "pytest -q"
              elif tf == "package.json":
                  import json as _j; pkg = _j.load(open(p))
                  if "test" in (pkg.get("scripts") or {}): test_command = "npm test"
              elif tf == "Cargo.toml": test_command = "cargo test"
          except Exception: pass
          if test_command: break

      reprocess = state.get("reprocess_done", False)
      candidates = [s for s in stories if reprocess or s.get("status") != "done"]
      # story_keys filter: subset opcional (piloto controlado / restringir escopo)
      skf = state.get("story_keys")
      if skf:
          skf_set = set(skf)
          candidates = [s for s in candidates if s["key"] in skf_set]
      missing = [s for s in candidates if not s.get("has_story_file")]

      # dry_run: pula a PREP inteira (prep_reconcile marca sprint-status/epic — escrita
      # destrutiva que não faz sentido em dry_run; evita também o bug do fan_in vazio).
      skip_prep = bool(state.get("dry_run")) or not candidates
      # coleta epic_nums/epic_keys reais a partir das candidates (no modo multi "all")
      if multi_epic and not epic_nums:
          _nums = {s.get("epic_num") for s in candidates if s.get("epic_num")}
          # sort: numéricos antes, depois alfabéticos (td); stable para "td"
          epic_nums = sorted(_nums, key=lambda x: (int(x) if str(x).isdigit() else 9999, str(x)))
          epic_keys = [f"epic-{n}" for n in epic_nums]
      print(f"Épico {epic_key} (\"{epic_label}\"): {len(stories)} stories, {len(candidates)} candidatas, {len(missing)} sem arquivo. branch={target_branch} suite={test_command or '(nenhuma)'}")
      return {
          "epic_num": epic_num, "epic_key": epic_key, "epic_label": epic_label,
          "multi_epic": multi_epic, "epic_nums": epic_nums, "epic_keys": epic_keys,
          "communication_language": comm_lang, "document_output_language": doc_lang, "user_name": user_name,
          "test_command": test_command, "target_branch": target_branch,
          "implementation_artifacts_dir": impl_artifacts, "sprint_status_path": sprint_status_path,
          "stories": stories, "candidates": candidates, "missing_files": missing,
          "skills_dir": state.get("skills_dir") or os.path.join(repo, ".claude/skills"),
          "story_keys_filter": state.get("story_keys") or [],
          "_skip_prep": skip_prep,
      }
    goto:
      - if: "state.get('_skip_prep')"
        to: graph_infer
      - to: prep_create

  # ============================================================================
  # PREP — cria stories faltantes (fan-out), reconcilia status, commita
  # ============================================================================
  - name: prep_create
    description: Cria em paralelo as stories faltantes (mesma árvore, sem worktree, sem tocar sprint-status)
    type: dynamic_parallel
    items: "{{ state.missing_files }}"
    item_var: mstory
    max_concurrency: 4
    fail_fast: false
    subgraph: "/home/ubuntu/src/the_edge_agent/examples/workflows/bmad-create-story.yaml"
    input:
      repo_path: "{{ state.repo_path }}"
      epic_key: "{{ state.epic_key }}"
      epic_num: "{{ state.epic_num }}"
      story_key: "{{ state.mstory.key }}"
      title: "{{ state.mstory.title }}"
      skills_dir: "{{ state.skills_dir }}"
      implementation_artifacts_dir: "{{ state.implementation_artifacts_dir }}"
      sprint_status_path: "{{ state.sprint_status_path }}"
      communication_language: "{{ state.communication_language }}"
      document_output_language: "{{ state.document_output_language }}"
      user_name: "{{ state.user_name }}"
      dev_model: "{{ state.dev_model | default('gpt-5.6-sol') }}"
    output: prep_create_results
    fan_in: prep_lock

  # ============================================================================
  # LOCK CROSS-RUN — tudo daqui pra frente escreve no repo PRINCIPAL sem isolamento,
  # porque é o único lugar onde um merge ou uma edição de sprint-status PODEM cair.
  # Dentro de uma invocação as arestas do grafo serializam isso; ENTRE invocações (uma
  # por épico, mesmo repo) não havia nada, e o resultado real foi HEAD destacado, merge
  # intercalado e stash deixado por um irmão.
  #
  # O JS expressa isso como uma lista L0-L5 injetada em cinco prompts. Aqui os passos são
  # Python determinístico, então o lock é código: nenhum LLM vai "ajudar" trocando o
  # `mkdir` atômico por um `mkdir -p`, que sai 0 numa pasta existente e faria todos os
  # irmãos acreditarem que têm o lock ao mesmo tempo.
  #
  # A criação de stories (prep_create) fica FORA do lock de propósito, igual ao JS: são N
  # agentes irmãos escrevendo N arquivos distintos, e o único recurso compartilhado
  # (sprint-status) já é proibido pra eles.
  # ============================================================================
  - name: prep_lock
    description: Toma o lock cross-run antes de reconciliar/commitar no repo principal
    run: |
      from the_edge_agent.bmad_epic_waves_git import acquire_main_repo_lock
      r = acquire_main_repo_lock(state.get("repo_path", "."), wait_seconds=float(state.get("lock_wait_seconds", 2400)))
      print(f"prep_lock: acquired={r['acquired']} reason={r['reason']}")
      return {"lock_owner": r["owner"] if r["acquired"] else "", "lock_reason": r["reason"]}
    goto:
      - if: "not state.get('lock_owner')"
        to: abort_lock
      - to: prep_reconcile

  - name: abort_lock
    description: Não conseguiu o lock — condição OPERACIONAL, nunca falha da story/merge
    run: |
      reason = state.get("lock_reason", "unknown")
      if reason == "environment":
          print("ABORT: o path do lock está inutilizável (permissão/diretório). Isso é problema de ambiente, não do código sendo integrado.")
      else:
          print("ABORT: outra invocação deste workflow segurou o lock do repo durante toda a espera. Rode de novo quando ela terminar.")
      return {"final_status": f"lock_{reason}"}
    goto: __end__

  - name: prep_reconcile
    description: Fan-in serial — checa arquivos criados e marca sprint-status UMA vez (porta reconcilePrompt)
    uses: llm.call
    with:
      provider: shell
      shell_provider: codex
      model: "{{ state.dev_model | default('gpt-5.6-sol') }}"
      timeout: 1800
      messages:
        - role: user
          content: |
            Você é um sub-agente sem contexto prévio, no repo real em {{ state.repo_path }}. Comunique-se em {{ state.communication_language }}. Usuário: {{ state.user_name }}.

            {{ state.missing_files | length }} stories do {{ state.epic_key }} acabaram de ser criadas em paralelo por agentes irmãos, que tinham PROIBIÇÃO de tocar sprint-status. Seu trabalho é o fan-in: checar o que existe no disco e fazer TODAS as marcações de status de uma vez. Você é o único agente escrevendo neste arquivo agora.

            Sempre leia do disco — não confie em memória nem em autorrelato.

            1. **Cheque cada arquivo esperado** (existe, não vazio, tem conteúdo de story de verdade — ACs, Dev Notes — e não um stub de uma linha):
            {% for s in state.missing_files %}   - {{ state.implementation_artifacts_dir }}/{{ s.key }}.md  (key: {{ s.key }})
            {% endfor %}
            2. **Procure colisões reais ENTRE os arquivos criados nesta rodada** (a lista do item 1 acima): dois keys diferentes cujos `.md` têm conteúdo praticamente idêntico — assinatura de dois agentes irmãos tendo escrito a mesma story por acidente do fan-out. Arquivos que **já existiam** antes desta rodada (pré-existentes, não estão na lista do item 1) **NÃO são duplicates**, mesmo que não estejam nela — você está reconciliando só o que foi criado agora. Se a lista do item 1 está vazia (`missing_files` vazio), deixe `DUPLICATES:` em branco e não liste nada.
            3. **Marque os statuses** em `{{ state.sprint_status_path }}`, só para os keys cujo arquivo passou o item 1: `development_status[<key>] = "ready-for-dev"`{% if not state.multi_epic %}, e `{{ state.epic_key }}` de `backlog` para `in-progress`{% else %}, e CADA um dos épicos `{{ state.epic_keys | join('`, `') }}` de `backlog` para `in-progress`{% endif %}. Atualize `last_updated`.
               **Formato de `last_updated` (OBRIGATÓRIO):** a linha atual é um scalar `YYYY-MM-DD` seguido de um comentário histórico longo após `#`. Preserve EXATAMENTE esse formato — troque só a data (a de hoje, `YYYY-MM-DD` sem aspas, sem horário/ISO), e mantenha o comentário `# ...` inteiro na mesma linha. NÃO converta para ISO, NÃO adicione aspas, NÃO remova o comentário. Se um status já está no valor alvo, não reescreva a linha (escrita idempotente).
               **Edição surgical, nunca regeneração:** mude só essas linhas. Não regenere o arquivo, não remova comentários (o topo costuma ser um log histórico longo), não toque `action_items`, não altere entries de outros époc, e NUNCA rebaixe um status existente (`done` nunca volta).
            4. **Valide o arquivo depois de escrever:** ainda parseia como YAML válido (`python3 -c "import yaml; yaml.safe_load(open('{{ state.sprint_status_path }}'))"`), o número de linhas não diminuiu, e `action_items` tem o mesmo número de itens. Reporte `sprint_status_intact` baseado nessa checagem real.
            5. Não commita nada.

            Imprima ao final:
            - `ALL_PRESENT: true|false`
            - `MISSING: <keys sem arquivo válido, separados por vírgula>`
            - `DUPLICATES: <paths suspeitos>`
            - `STATUS_UPDATED: <keys marcados, separados por vírgula>`
            - `SPRINT_STATUS_INTACT: true|false`

            **Formato estrito dos marcadores** (um parser por linha lê isto — NUNCA escreva a
            palavra "none", "n/a" ou "-" como valor): quando uma lista for vazia, deixe o
            campo em branco após os dois-pontos (ex.: `MISSING:` sozinho numa linha). Para
            listas não-vazias, separe os itens por vírgula sem "none". Use exatamente um
            marcador por linha, na ordem acima.
    output: reconcile_output

  - name: parse_reconcile
    description: Parseia o resultado do reconcile e decide abortar ou commitar
    run: |
      import re, os
      out = state.get("reconcile_output", {})
      text = out.get("content", "") if isinstance(out, dict) else (str(out) if out else "")
      t = text.lower()
      all_present = "all_present: true" in t
      intact = "sprint_status_intact: true" in t
      # [ \t]* (NÃO \s*) — \s casa '\n' e faz o regex saltar a linha, capturando o
      # campo seguinte quando MISSING/DUPLICATES vêm vazios. Ex.: "MISSING:\nDUPLICATES:\nSTATUS_UPDATED: k"
      # com \s* vira missing_after=['duplicates:'] e duplicates=['status_updated: k'].
      # _sentinel filtra "none"/"n/a"/"-"/"nil"/"null" que o Codex às vezes escreve para
      # indicar "vazio" (já vimos "MISSING: none" virar missing_after=['none'] → ABORT falso).
      _sentinels = {"", "none", "n/a", "na", "-", "nil", "null", "nenhum", "nenhuma"}
      def _norm_list(raw):
          return [k.strip() for k in (raw.split(",") if raw else []) if k.strip().lower() not in _sentinels]
      miss_m = re.search(r'missing:[ \t]*([^\n]*)', t)
      missing_after = _norm_list(miss_m.group(1) if miss_m else "")
      dup_m = re.search(r'duplicates:[ \t]*([^\n]*)', t)
      duplicates = _norm_list(dup_m.group(1) if dup_m else "")
      print(f"Reconcile: all_present={all_present} intact={intact} missing_after={missing_after} duplicates={duplicates}")
      # Atualiza story_paths das criadas
      repo = state.get("repo_path", ".")
      impl = state.get("implementation_artifacts_dir", "_bmad-output/implementation-artifacts")
      stories = state.get("stories", [])
      for s in stories:
          if not s.get("has_story_file"):
              sp = os.path.join(repo, impl, f"{s['key']}.md")
              if os.path.isfile(sp):
                  s["has_story_file"] = True
                  s["story_path"] = sp
      if not all_present or missing_after:
          return {"_prep_next": "abort_missing", "missing_after": missing_after, "stories": stories}
      return {"_prep_next": "prep_commit", "sprint_status_intact": intact, "duplicates": duplicates, "stories": stories}
    goto:
      - if: "state.get('_prep_next') == 'abort_missing'"
        to: abort_missing
      - to: prep_commit

  - name: prep_commit
    description: Commita os arquivos criados + sprint-status (git add por nome, determinístico)
    run: |
      import os, re, subprocess
      from the_edge_agent.bmad_epic_waves_git import heartbeat_main_repo_lock, release_main_repo_lock
      repo = state.get("repo_path", ".")
      # Último passo da PREP dentro do lock: solta em TODOS os caminhos de saída. Não
      # soltar num caminho de erro congela toda invocação irmã atrás desta.
      _owner = state.get("lock_owner") or ""
      if _owner: heartbeat_main_repo_lock(repo, _owner)
      def _unlock(payload):
          if _owner: release_main_repo_lock(repo, _owner)
          payload["lock_owner"] = ""
          return payload
      impl = state.get("implementation_artifacts_dir", "_bmad-output/implementation-artifacts")
      ss = state.get("sprint_status_path", "_bmad-output/implementation-artifacts/sprint-status.yaml")
      missing = state.get("missing_files", [])
      # Paths a commitar (relativos ao repo)
      paths = [os.path.join(impl, f"{m['key']}.md") for m in missing]
      paths.append(ss)
      # só os que existem
      to_add = [p for p in paths if os.path.isfile(os.path.join(repo, p))]
      if not to_add:
          # nada para commitar (stories já existiam) — segue com HEAD atual
          try: head = subprocess.check_output(["git","rev-parse","HEAD"], cwd=repo, text=True).strip()
          except Exception: head = ""
          print("Prep: nada novo para commitar.")
          return _unlock({"prep_committed": False, "prep_head_sha": head, "_prep_next": "check_stop"})
      # git add por nome (nunca -A)
      subprocess.run(["git","add"] + to_add, cwd=repo, check=True)
      staged = subprocess.check_output(["git","diff","--cached","--name-only"], cwd=repo, text=True).strip().splitlines()
      # Escrita idempotente: o reconcile pode reportar STATUS_UPDATED mas não produzir diff
      # (status já era o alvo). Nada staged = nada a commitar — segue com HEAD atual, não
      # tenta `git commit` (que retornaria != 0 com "nothing to commit" → abort falso).
      if not staged:
          try: head = subprocess.check_output(["git","rev-parse","HEAD"], cwd=repo, text=True).strip()
          except Exception: head = ""
          print("Prep: nada novo para commitar (status já marcado, escrita idempotente).")
          return _unlock({"prep_committed": False, "prep_head_sha": head, "_prep_next": "check_stop"})
      # Copia padrão de commit do repo (Co-Authored-By)
      try:
          prev_body = subprocess.check_output(["git","log","-1","--format=%b"], cwd=repo, text=True)
      except Exception:
          prev_body = ""
      co_auth = ""
      mco = re.search(r'(Co-Authored-By:.*)', prev_body, re.M)
      if mco: co_auth = "\n\n" + mco.group(1)
      msg = f"docs({state.get('epic_key')}): create the epic's story files\n\n{len(to_add)} stories criadas, statuses movidos para ready-for-dev.{co_auth}"
      r = subprocess.run(["git","commit","-m", msg], cwd=repo, capture_output=True, text=True)
      if r.returncode != 0:
          print(f"prep_commit falhou: {r.stderr}")
          return _unlock({"prep_committed": False, "_prep_next": "abort_commit_failed"})
      head = subprocess.check_output(["git","rev-parse","HEAD"], cwd=repo, text=True).strip()
      print(f"Prep commitado: {head} ({len(to_add)} arquivos)")
      return _unlock({"prep_committed": True, "prep_head_sha": head, "_prep_next": "check_stop"})
    goto:
      - if: "state.get('_prep_next') == 'abort_commit_failed'"
        to: abort_commit_failed
      - to: check_stop_after_prep

  - name: check_stop_after_prep
    description: Se stop_after_prep, para aqui
    run: |
      if state.get("stop_after_prep"):
          print("stop_after_prep — parando. Revise os arquivos de story antes de rodar o épico.")
          return {"final_status": "stopped_after_prep"}
      return {"_stop": False}
    goto:
      - if: "state.get('stop_after_prep')"
        to: __end__
      - to: graph_infer

  - name: abort_missing
    description: Aborta por stories faltantes após PREP
    run: |
      from the_edge_agent.bmad_epic_waves_git import release_main_repo_lock
      print(f"ABORT: stories ainda faltando após PREP: {state.get('missing_after')}")
      if state.get("lock_owner"):
          release_main_repo_lock(state.get("repo_path", "."), state["lock_owner"])
      return {"final_status": "story_creation_incomplete", "lock_owner": ""}
    goto: __end__

  - name: abort_commit_failed
    description: Aborta por falha no commit da PREP
    run: |
      print("ABORT: prep_commit_failed — stories criadas mas não commitadas. Commite à mão (git add por nome) e rode de novo.")
      return {"final_status": "prep_commit_failed"}
    goto: __end__

  # ============================================================================
  # GRAPH — inferência de dependências (LLM) + ondas (determinístico)
  # ============================================================================
  - name: graph_infer
    description: Decide se usa deps override ou infere o grafo com LLM
    run: |
      if state.get("deps"):
          print("args.deps fornecido — inferência de grafo PULADA.")
          return {"_graph_next": "build_waves"}
      return {"_graph_next": "graph_llm"}
    goto:
      - if: "state.get('_graph_next') == 'build_waves'"
        to: build_waves
      - to: graph_llm

  - name: graph_llm
    description: Infere as arestas de dependência entre stories (porta graphPrompt do JS)
    uses: llm.call
    with:
      provider: shell
      shell_provider: codex
      model: "{{ state.dev_model | default('gpt-5.6-sol') }}"
      timeout: 3600
      messages:
        - role: user
          content: |
            Você é um sub-agente sem contexto prévio, no repo real em {{ state.repo_path }}. Comunique-se em {{ state.communication_language }}. Usuário: {{ state.user_name }}.

            Sua tarefa é UMA coisa: descobrir as dependências entre as stories{% if state.multi_epic %} de MÚLTIPLOS épicos ({{ state.epic_keys | join(', ') }}){% else %} do {{ state.epic_key }} ("{{ state.epic_label }}"){% endif %}. Você NÃO implementa nada e NÃO decide o que roda em paralelo — só retorna as arestas do grafo. O agrupamento em ondas é computado depois, em código, a partir do que você retorna.

            Stories (use estas keys EXATAS nas arestas — o prefixo numérico identifica o épico):
            {% for s in state.candidates %}- {{ s.key }} — "{{ s.title }}" ({{ s.story_path }}){% if s.epic_num %} [epic {{ s.epic_num }}]{% endif %}
            {% endfor %}

            FONTES, em ordem de peso evidencial:
            1. O arquivo de cada story: Dev Notes, "Task 0"/pré-condições bloqueantes, menções literais a outra story ("depends on", "after X is done", "reuses the module from Y"). Task 0 costuma bloquear num épico IRMÃO (ex.: "espera epic-N fechar"); isso é uma aresta cross-épico.
            2. A seção do épico em `_bmad-output/planning-artifacts/epics.md` — notas de ordenação obrigatória, fundações declaradas, trade-offs{% if state.multi_epic %} (cheque a seção de CADA um dos épicos envolvidos){% endif %}.
            3. Os arquivos que cada story diz que vai tocar (File List planejada, paths citados nos ACs) e o CÓDIGO REAL nesses paths.{% if state.multi_epic %} A sobreposição de ARQUIVOS entre stories de épicos diferentes é a fonte mais comum de aresta cross-épico (kind=file): duas stories de épicos distintos editando o MESMO arquivo na mesma onda produzem conflito de merge.{% endif %}

            Retorne DOIS tipos de aresta:
            - **kind=logic**: story `to` precisa do que `from` constrói — um módulo, um contrato, uma decisão. Implementar fora de ordem produz código incoerente.
            - **kind=file**: as duas editam o MESMO arquivo, sem dependência conceitual. Importa porque cada story roda num worktree isolado e é mergeada depois: duas stories editando o mesmo arquivo na mesma onda produzem conflito de merge. Serializá-las é mais barato que resolver o conflito.

            ⚠️ **VIÉS OBRIGATÓRIO — os erros não são simétricos.** Uma aresta FALTANTE faz duas stories que deveriam ser sequenciais rodarem juntas: conflito de merge no melhor caso, código incoerente no pior. Uma aresta EXTRA só custa paralelismo — o pipeline fica mais lento e nada quebra. Portanto: **na dúvida, ADICIONE a aresta.** Não tente maximizar paralelismo; maximize a chance de a ordem estar correta. Só omita uma aresta quando há evidência positiva de que as duas stories são realmente independentes.

            REGRAS:
            - `evidence` deve ser concreta e verificável: citação literal da story, ou path do arquivo compartilhado. Nunca "parecem relacionadas".
            - Não invente aresta só da NUMERAÇÃO. 10-2 vir depois de 10-1 não implica dependência; muitos épicos têm stories numeradas sequencialmente mas mutualmente independentes.{% if state.multi_epic %} O MESMO vale cross-épico: epic-29 não depende de epic-8 só pela numeração; só crie aresta cross-épico com Task 0 bloqueante literal ou sobreposição de arquivo real.
            - Arestas cross-épico (kind=logic via Task 0, ou kind=file via arquivo compartilhado) são ESPERADAS e desejáveis quando reais — sem elas, duas stories de épicos diferentes que bloqueiam uma à outra rodariam juntas e produziriam conflito/código incoerente.{% endif %}
            - Sem ciclos. Se A e B parecem depender um do outro, escolha a direção que reflete a ordem real de construção e explique em `analysis`.
            - Em `analysis`, diga também o que você checou e concluiu ser INDEPENDENTE — a ausência de aresta é uma asserção sua, e precisa ser deliberada.

            **DEPENDÊNCIAS CROSS-ÉPICO NÃO SATISFEITAS.** Lendo a fonte 1 (a Task 0 / seção de DEPENDENCIES de cada story), algumas stories nomeiam um pré-requisito que pertence a um épico que NÃO está nesta rodada. Não descarte isso como "fora do escopo do grafo": uma onda montada sem saber disso despacha um agente de dev que descobre o mesmo impedimento sozinho, no meio da implementação, depois de já ter sido pago — isso já aconteceu. Para cada dependência dura dessas (mesma régua de evidência de uma aresta `logic`: literal e explícita, nunca temática), leia o status ATUAL da outra story direto do `{{ state.sprint_status_path }}` (nunca assuma que está satisfeita) e imprima uma linha:
            `EXTERNAL_BLOCKER: <story deste run> NEEDS <key da outra story> STATUS <status atual lido do disco> EVIDENCE: <citação literal da Task 0>`
            Use a key EXATA da lista acima para `<story deste run>` — a mesma exigência das arestas. Se a outra story já está `done`, imprima assim mesmo com o status real: quem decide é o parser, não você.

            {% if state.auto_model %}**CLASSIFICAÇÃO DE COMPLEXIDADE.** Você já está lendo cada story inteira e o código real nos paths que elas tocam. Aproveite e classifique o ESFORÇO DE IMPLEMENTAÇÃO de cada uma, uma linha por story:
            `COMPLEXITY: <story> [trivial|small|standard|frontier] <justificativa numa linha>`

            Classifique pelo que implementar exige DE FATO, não pela importância da story nem pelo capricho com que ela foi escrita:
            - **trivial** — edição mecânica cuja forma já está inteiramente determinada pela story: mudar uma constante, ajustar mensagem, renomear, atualizar tabela de valores. Sem contrato novo, sem decisão de design, e os testes a tocar já existem.
            - **small** — mudança localizada em um ou dois arquivos contra um contrato que JÁ EXISTE no código. Testes novos, mas nenhuma abstração nova e nada a decidir.
            - **standard** — o caso comum. Vários arquivos, uma função/contrato novo que outro código vai consumir, uma decisão real sobre onde um comportamento mora, mudança transversal, reescrita de fluxo existente, ordenação que é load-bearing para correção, ou story cujas próprias Dev Notes dizem que a abordagem ainda está em aberto.
            - **frontier** — a story mais difícil do épico: algoritmo/protocolo que precisa ser derivado e não apenas aplicado, migração cujo argumento de correção atravessa o sistema inteiro, problema que a própria story enquadra como em aberto.

            ⚠️ **Na dúvida entre dois tiers, escolha o MAIS ALTO.** Os custos são assimétricos: uma story superclassificada gasta um pouco mais de raciocínio; uma subclassificada reprova no review, queima os ciclos de fix e pode deixar código sutilmente errado em que uma story seguinte se apoia. Reserve `trivial` para os casos em que você LEU o código alvo e não há nada a decidir.

            **Dificuldade não é o único critério — raio de impacto conta.** Ter muitos dependentes não torna a story mais difícil de implementar, mas torna errar nela muito mais caro: as stories que consomem o contrato herdam o erro e já estão mergeadas quando alguém percebe. Então, quando uma story está na fronteira entre dois tiers E outras dependem dela, resolva a fronteira para cima. Não inverta: uma story-folha não é fácil por ser folha.
            {% endif %}
            Imprima cada aresta numa linha: `EDGE: <from> -> <to> [kind] EVIDENCE: <evidence>`
            Ao final, uma linha `ANALYSIS: <texto>` (pode usar várias linhas começando com `ANALYSIS:`).
    output: graph_output

  - name: build_waves
    description: Porta computeWaves() do JS — resolve prefixos, layers topológico, constrói tasks p/ execution.run
    run: |
      import os, re, json

      candidates = state.get("candidates", [])
      stories = state.get("stories", [])
      epic_num = state.get("epic_num", "")
      epic_key = state.get("epic_key", "")
      keys = [c["key"] for c in candidates]
      key_set = set(keys)
      # finished_keys: TODAS as stories done no sprint-status (não só as do épico).
      # O state.stories é filtrado por épico no discover_epic; lemos o YAML bruto aqui
      # pra resolver dependências cross-épico (ex.: 29-2 done -> satisfeita pra 30-10).
      import yaml as _yaml
      finished_keys = []
      _ss_path = state.get("sprint_status_path", "")
      _repo = state.get("repo_path", ".")
      _ss_full = _ss_path if os.path.isabs(_ss_path) else os.path.join(_repo, _ss_path)
      try:
          _dev = (_yaml.safe_load(open(_ss_full)) or {}).get("development_status", {}) or {}
          finished_keys = [k for k, v in _dev.items()
                          if (v if isinstance(v, str) else (v.get("status") if isinstance(v, dict) else str(v))) == "done"
                          and k not in key_set]
      except Exception:
          finished_keys = [s["key"] for s in stories if s.get("status") == "done" and s["key"] not in key_set]

      # Parse edges do graph_output (ou usa deps override)
      deps_raw = state.get("deps") or {}
      edges = []
      analysis = ""
      blockers_raw, complexity_raw = [], []
      auto_model = bool(state.get("auto_model"))
      if not deps_raw:
          out = state.get("graph_output", {})
          text = out.get("content", "") if isinstance(out, dict) else (str(out) if out else "")
          for line in text.splitlines():
              em = re.match(r'\s*EDGE:\s*(\S+)\s*->\s*(\S+)\s*\[(\w+)\]\s*EVIDENCE:\s*(.*)$', line)
              bm = re.match(r'\s*EXTERNAL_BLOCKER:\s*(\S+)\s+NEEDS\s+(\S+)\s+STATUS\s+(\S+)\s*(?:EVIDENCE:\s*(.*))?$', line, re.I)
              cm = re.match(r'\s*COMPLEXITY:\s*(\S+)\s*\[(\w+)\]\s*(.*)$', line, re.I)
              if em:
                  edges.append({"from": em.group(1), "to": em.group(2), "kind": em.group(3), "evidence": em.group(4)})
              elif bm:
                  blockers_raw.append({"story": bm.group(1), "requires_key": bm.group(2),
                                       "current_status": (bm.group(3) or "").strip().lower(),
                                       "requires_status": "done", "evidence": (bm.group(4) or "").strip()})
              elif cm:
                  complexity_raw.append({"story": cm.group(1), "tier": cm.group(2).strip().lower(),
                                         "rationale": cm.group(3).strip()})
              elif line.strip().startswith("ANALYSIS:"):
                  analysis += line.split("ANALYSIS:",1)[1].strip() + " "
          # Monta deps_raw a partir das edges (to depende de from)
          for e in edges:
              deps_raw.setdefault(e["to"], []).append(e["from"])
      else:
          print("args.deps fornecido — isto pula TAMBÉM a detecção de bloqueio cross-épico"
                + (" e a classificação de complexidade (todas as stories caem no provider default)." if auto_model else "."))

      # ---- Port do computeWaves() ----
      def resolve(raw, origin=""):
          if raw in key_set: return raw
          hits = [k for k in keys if k == raw or k.startswith(raw + "-")]
          if len(hits) == 1: return hits[0]
          if len(hits) > 1:
              raise Exception(f'dependência "{raw}" é AMBÍGUA — bate com {len(hits)}: {hits}')
          fin = [k for k in finished_keys if k == raw or k.startswith(raw + "-")]
          if fin:
              print(f'Dependência "{raw}" já done ({fin}) — satisfeita, removida do layering.')
              return None
          # Dependência cross-épico não-done (não está no conjunto nem finished):
          # descarta do layering — o Task 0 do story-cycle barrará (dev_failed) se a dep
          # realmente faltar no disco. Não trava o orquestrador inteiro por uma dep externa.
          print(f'Dependência "{raw}" não é do {epic_key} nem done — descartada do layering (Task 0 barrará se faltar no disco).')
          return None

      deps = {k: [] for k in keys}
      for raw_k, raw_list in (deps_raw or {}).items():
          k = resolve(raw_k)
          if k is None: continue
          deps[k] = [d for d in (resolve(dd, k) for dd in (raw_list or [])) if d is not None]

      # ---- Bloqueadores cross-épico ------------------------------------------
      # A key vem de texto livre do agente e não é garantidamente a key completa. Resolve
      # com a MESMA tolerância a prefixo do resolve() acima: uma forma curta que casasse
      # com nada faria esta rede aparecer no log sem bloquear story nenhuma — pior do que
      # não existir, porque PARECE que funcionou.
      def resolve_story(raw):
          if raw in key_set: return raw
          hits = [k for k in keys if k == raw or k.startswith(raw + "-")]
          return hits[0] if len(hits) == 1 else None

      external_blockers, blocked_direct = [], set()
      for b in blockers_raw:
          if b["current_status"] == (b.get("requires_status") or "done"):
              continue  # dependência cross-épico já satisfeita: não é bloqueio
          k = resolve_story(b["story"])
          if not k:
              print(f'⚠️  EXTERNAL_BLOCKER cita story "{b["story"]}", que não casa com nenhuma candidata (0 ou >1 matches) — IGNORADO, confira à mão: {b["evidence"][:120]}')
              continue
          b = dict(b, story=k)
          external_blockers.append(b)
          blocked_direct.add(k)

      # Fecho transitivo: quem depende de uma story bloqueada também não pode rodar. O JS
      # só pula a bloqueada e conta com o stopOnWaveFailure para o resto; aqui, como as
      # ondas são despachadas de uma vez pelo DOT, o dependente rodaria feliz sobre um
      # contrato que não existe. Excluir o fecho é a versão que não depende de timing.
      blocked_all = set(blocked_direct)
      changed = True
      while changed:
          changed = False
          for k in keys:
              if k in blocked_all: continue
              if any(d in blocked_all for d in deps.get(k, [])):
                  blocked_all.add(k); changed = True
      if external_blockers:
          print(f"⚠️  {len(blocked_direct)} story(ies) bloqueada(s) por dependência cross-épico não satisfeita — não serão despachadas (nenhum agente de dev gasto):")
          for b in external_blockers:
              print(f'  {b["story"]} precisa de {b["requires_key"]} (hoje "{b["current_status"]}", precisa "{b["requires_status"]}") — {b["evidence"][:140]}')
          cascade = sorted(blocked_all - blocked_direct)
          if cascade:
              print(f"  + {len(cascade)} dependente(s) adiada(s) junto: {', '.join(cascade)}")

      keys = [k for k in keys if k not in blocked_all]
      key_set = set(keys)
      deps = {k: [d for d in deps.get(k, []) if d in key_set] for k in keys}
      if not keys:
          print("Nenhuma story despachável nesta rodada (todas bloqueadas ou nada pendente).")

      # ---- Classificação de complexidade -> tier -> shell_provider ------------
      DEFAULT_TIER_PROVIDERS = {"trivial": "codex_trivial", "small": "codex_small",
                                "standard": "codex_standard", "frontier": "codex_frontier"}
      tier_providers = dict(DEFAULT_TIER_PROVIDERS)
      tier_providers.update(state.get("model_tiers") or {})
      story_tiers = {}
      if auto_model:
          for c in complexity_raw:
              k = resolve_story(c["story"])
              if not k:
                  print(f'⚠️  COMPLEXITY cita story "{c["story"]}", que não casa com nenhuma candidata — IGNORADA, cai no provider default.')
                  continue
              if c["tier"] not in tier_providers:
                  print(f'⚠️  {k}: tier desconhecido "{c["tier"]}" — cai no provider default.')
                  continue
              if k in story_tiers:
                  # Duas entradas para a mesma story deixariam tierByKey com a última
                  # enquanto o log mostra as duas: a primeira vence, e a colisão aparece.
                  print(f'⚠️  COMPLEXITY duplicada para {k} (tier "{c["tier"]}") — ignorada, mantendo "{story_tiers[k]}".')
                  continue
              story_tiers[k] = c["tier"]
          if story_tiers:
              print("Classificação de complexidade (esforço do dev por story):")
              for c in complexity_raw:
                  k = resolve_story(c["story"])
                  if k and story_tiers.get(k) == c["tier"]:
                      print(f'  {k} [{c["tier"]}] -> {tier_providers[c["tier"]]} — {c["rationale"][:120]}')
          unclassified = [k for k in keys if k not in story_tiers]
          if unclassified:
              print(f"⚠️  {len(unclassified)} story(ies) sem classificação — provider default: {', '.join(unclassified)}")

      wave = {}
      visiting = set()
      def depth(k, trail):
          if k in wave: return wave[k]
          if k in visiting:
              raise Exception(f'CICLO de dependência: {" -> ".join(trail + [k])}')
          visiting.add(k)
          w = 1
          for d in deps[k]:
              w = max(w, depth(d, trail + [k]) + 1)
          visiting.discard(k)
          wave[k] = w
          return w
      for k in keys: depth(k, [])

      max_wave = max(wave.values()) if wave else 0
      all_waves = [[k for k in keys if wave[k] == i] for i in range(1, max_wave + 1)]

      only_wave = state.get("only_wave")
      if only_wave:
          waves = [all_waves[only_wave - 1]] if 1 <= only_wave <= len(all_waves) else []
          print(f"onlyWave={only_wave}: executando só a onda {only_wave}.")
      else:
          waves = all_waves

      serial_cost = len(keys) - len(waves)
      print(f"Épico {epic_key}: {len(keys)} despacháveis (de {len(candidates)} candidatas) em {len(waves)} onda(s) — {serial_cost} passo(s) salvos vs. sequencial.")
      for i, w in enumerate(waves):
          print(f"  Onda {i+1} ({len(w)} em paralelo): {', '.join(w)}")
      for e in edges:
          print(f"  {e['from']} -> {e['to']} [{e['kind']}] {e['evidence'][:80]}")

      # ---- Gera o grafo DOT (Command Mode) — o tea --from-dot faz topological sort + ondas nativo ----
      # execution.run NÃO existe no tea 0.9.108; o DOT é a primitiva nativa de ondas com deps.
      # Cada story roda num git worktree isolado (branch story/<key> a partir de target_branch);
      # o subgraph bmad-story-cycle.yaml com in_worktree=true commita no branch da worktree e
      # NÃO toca no sprint-status (deixa pro merge serial em merge_worktrees).
      import tempfile, subprocess
      repo = state.get("repo_path", ".")
      repo_abs = os.path.realpath(repo)
      target_branch = state.get("target_branch", "main")
      # binário tea absoluto (evita PATH shadowing dentro das tmux windows do DOT)
      tea_bin = os.environ.get("TEA_BIN") or "/home/fabricio/src/the_edge_agent/.venv/bin/tea"
      # subgraph_path DEVE ser absoluto: o run_waves chama `tea --from-dot` com cwd=repo_path
      # (licityeasy), onde `examples/workflows/` não existe. Deriva do tea_bin (venv/bin -> repo).
      _tea_home = os.path.dirname(os.path.dirname(os.path.dirname(os.path.realpath(tea_bin))))
      subgraph_path = state.get("subgraph_path") or os.path.join(_tea_home, "examples", "workflows", "bmad-story-cycle.yaml")
      if not os.path.isabs(subgraph_path):
          subgraph_path = os.path.join(_tea_home, subgraph_path)
      skills_dir = state.get("skills_dir") or os.path.join(repo_abs, ".claude/skills")
      impl_dir = state.get("implementation_artifacts_dir", "_bmad-output/implementation-artifacts")
      # Worktrees em /tmp (não sujam o repo). Dir base por epic_key p/ isolamento entre runs.
      # Em dry_run NÃO cria worktrees (efeito colateral) — o DOT aponta pro repo principal.
      wt_base = state.get("worktree_base") or os.path.join(tempfile.gettempdir(), f"tea-wt-{epic_key}")
      worktrees = []
      dry = bool(state.get("dry_run"))
      if not dry:
          from the_edge_agent.bmad_epic_waves_git import branch_has_unmerged_commits
          stale = []
          for k in keys:
              branch = f"story/{k}"
              contributes, tip = branch_has_unmerged_commits(repo_abs, branch)
              if contributes:
                  stale.append(f"{branch}@{tip[:8]}")
          if stale:
              raise Exception("retry recusado: branches de story ainda não integradas foram preservadas: " + ", ".join(stale))
          os.makedirs(wt_base, exist_ok=True)
          # Limpa apenas worktrees/branches vazias ou já ancestrais do target.
          _old = subprocess.run(["git","worktree","list","--porcelain"], cwd=repo_abs, capture_output=True, text=True)
          for line in _old.stdout.splitlines():
              if line.startswith("worktree "):
                  p = line.split(" ",1)[1]
                  if os.path.realpath(p).startswith(os.path.realpath(wt_base)):
                      subprocess.run(["git","worktree","remove","--force",p], cwd=repo_abs, capture_output=True)
          for k in keys:
              wt_path = os.path.join(wt_base, k.replace("/", "_"))
              wt_branch = f"story/{k}"
              subprocess.run(["git","branch","-D", wt_branch], cwd=repo_abs, capture_output=True)
              r = subprocess.run(["git","worktree","add","-b", wt_branch, wt_path, target_branch],
                                 cwd=repo_abs, capture_output=True, text=True)
              if r.returncode != 0:
                  print(f"worktree add falhou para {k}: {r.stderr.strip()}")
                  raise Exception(f"worktree_create falhou para {k}: {r.stderr.strip()}")
              worktrees.append({"key": k, "path": wt_path, "branch": wt_branch})
          print(f"Worktrees criadas: {len(worktrees)} em {wt_base}")
      else:
          print("DRY_RUN: worktrees NÃO criadas (DOT aponta pro repo principal).")
      # common: payload do subgraph. repo_path = path da worktree (git opera ali);
      # skills_dir = repo principal (a worktree nao tem .claude/skills). Em dry_run, repo principal.
      common = {
          "skills_dir": skills_dir,
          "implementation_artifacts_dir": impl_dir,
          "sprint_status_path": state.get("sprint_status_path", "_bmad-output/implementation-artifacts/sprint-status.yaml"),
          "communication_language": state.get("communication_language", "Português"),
          "document_output_language": state.get("document_output_language", "Português"),
          "user_name": state.get("user_name", "Fabrício"),
          "dev_model": state.get("dev_model") or "gpt-5.6-sol",
          "review_model": state.get("review_model") or "gpt-5.6-sol",
          "test_command": state.get("test_command", ""),
          "target_branch": target_branch,
          "create_if_missing": False,  # PREP já criou tudo
          "max_review_cycles": int(state.get("max_review_cycles", 3)),
          "in_worktree": (not dry),  # True em run real (commita no branch da worktree)
      }
      cmap = {c["key"]: c for c in candidates}
      wtmap = {w["key"]: w for w in worktrees}
      # story_path relativo à worktree (impl_dir/key.md) — o subgraph resolve contra repo_path=worktree
      def _story_rel(k):
          return os.path.join(impl_dir, f"{k}.md")
      # IDs seguros no DOT (keys têm hífen): s<idx>; label = key (mostra no tmux/output)
      id_of = {k: f"s{i}" for i, k in enumerate(keys)}
      dot_payloads = {}
      lines = ['digraph epic_waves {', '  rankdir=TB;', '  node [shape=box];',
               '  Start [label="Start", shape=ellipse];', '  End [label="End", shape=ellipse];']
      for k in keys:
          c = cmap[k]
          payload = dict(common)
          if dry:
              wt_path, cd_prefix = repo_abs, ""
          else:
              wt_path, cd_prefix = wtmap[k]["path"], f"cd {wtmap[k]['path']} && "
          tier = story_tiers.get(k)
          payload.update({
              "repo_path": wt_path,
              "epic_key": f"epic-{c.get('epic_num', epic_num)}" if c.get('epic_num') else epic_key,
              "epic_num": c.get("epic_num", epic_num),
              "story_key": k, "title": c.get("title", k),
              "story_path": _story_rel(k),
              # Sem tier (auto_model off, ou story não classificada) = comportamento antigo:
              # o subgraph cai no provider `codex` (xhigh).
              "dev_provider": tier_providers.get(tier, "codex") if tier else "codex",
              "review_provider": "codex_review",
              "story_tier": tier or "",
          })
          dot_payloads[k] = payload
          j = json.dumps(payload)
          # command: cd worktree && tea run subgraph --input '<json>' (ou repo principal em dry_run)
          #
          # --fail-on-state: sem isto o `tea run` sai 0 mesmo quando a story termina
          # `incomplete` (review reprovado / ciclos esgotados), o DOT reporta "Completed",
          # e o merge_worktrees — que só exige presença em `succeeded` — integrava no
          # branch alvo uma story que o revisor tinha rejeitado. O JS nunca mergeia sem
          # verdict=approve; este flag é o equivalente nativo dessa invariante.
          cmd = (f"{cd_prefix}{tea_bin} run {subgraph_path} --input '{j}'"
                 f" --fail-on-state 'final_status=incomplete'"
                 f" --fail-on-state 'final_status=missing_story_file'")
          cmd_dot = cmd.replace('\\', '\\\\').replace('"', '\\"')
          label_dot = k.replace('"', '\\"')
          lines.append(f'  {id_of[k]} [label="{label_dot}" command="{cmd_dot}"];')
      # Arestas de dependência (from -> to) e ligação a Start/End
      has_children = set()
      for k in keys:
          for d in deps[k]:
              lines.append(f'  {id_of[d]} -> {id_of[k]};')
              has_children.add(d)
      for k in keys:
          if not deps[k]:
              lines.append(f'  Start -> {id_of[k]};')
      for k in keys:
          if k not in has_children:
              lines.append(f'  {id_of[k]} -> End;')
      lines.append('}')
      dot_content = "\n".join(lines)
      dot_dir = os.path.join(tempfile.gettempdir(), "tea-epic-waves")
      os.makedirs(dot_dir, exist_ok=True)
      dot_path = os.path.join(dot_dir, f"{epic_key}.dot")
      with open(dot_path, "w") as f:
          f.write(dot_content)
      print(f"DOT gerado: {dot_path} ({len(keys)} nós, {sum(len(v) for v in deps.values())} arestas)")

      # HEAD antes de qualquer merge desta rodada: é o que delimita o range do épico para
      # a checagem de cobertura da suíte no verify.
      run_base_head = subprocess.run(["git","rev-parse","HEAD"], cwd=repo_abs, capture_output=True, text=True).stdout.strip()

      common_out = {
          "graph_edges": edges, "graph_analysis": analysis,
          "external_blockers": external_blockers, "blocked_stories": sorted(blocked_all),
          "story_tiers": story_tiers, "run_base_head": run_base_head,
          # A escalação por falha remonta o comando de UMA story; guardar o payload evita
          # recalcular (e divergir de) tudo o que foi decidido aqui.
          "dot_payloads": dot_payloads, "tea_bin": tea_bin, "subgraph_path": subgraph_path,
          "tier_providers": tier_providers,
      }
      if state.get("dry_run"):
          print("DRY_RUN — não executando. Plano de ondas acima; DOT em " + dot_path)
          if auto_model:
              print("Plano de modelo por story:")
              for k in keys:
                  t = story_tiers.get(k)
                  print(f"  {k}: tier={t or '(nenhum)'} provider={tier_providers.get(t, 'codex') if t else 'codex'}")
          return dict(common_out, final_status="dry_run", waves=[[k for k in w] for w in waves],
                      dot_path=dot_path, worktree_base=wt_base)

      return dict(common_out, waves=waves, deps_resolved=deps, dot_path=dot_path,
                  only_wave=only_wave, worktrees=worktrees, worktree_base=wt_base)
    goto:
      - if: "state.get('final_status') == 'dry_run'"
        to: __end__
      - to: run_waves

  # ============================================================================
  # RUN WAVES — DOT nativo (tea run --from-dot). execution.run NÃO existe no tea
  # 0.9.108; o DOT é a primitiva nativa de ondas com dependências (topological sort
  # + paralelo via tmux + retomada por wave/step/label).
  # ============================================================================
  - name: run_waves
    description: Executa as stories em ondas via DOT nativo (tea run --from-dot)
    run: |
      import os, subprocess, re
      dot_path = state.get("dot_path")
      if not dot_path or not os.path.isfile(dot_path):
          print("run_waves: dot_path ausente — pulando (nada para executar)")
          return {"run_waves_results": {"rc": 0, "stdout": "", "succeeded": [], "all_ok": True, "skipped": True}}
      tea_bin = os.environ.get("TEA_BIN") or "/home/fabricio/src/the_edge_agent/.venv/bin/tea"
      epic_key = state.get("epic_key", "epic")
      session_name = str(epic_key)  # sem prefixo: epic_key já é "epic-8"/"epics-all"
      max_parallel = int(state.get("dot_max_parallel", 4))
      # 86400s = 24h. Default alto: stories grandes gpt-5.6-sol/xhigh com N ciclos de
      # review extrapolam 3h (o default antigo matou o epic-8 em 20:29, abortando antes
      # do merge_worktrees e deixando o story-cycle órfão em tmux).
      dot_timeout = int(state.get("dot_timeout", 86400))
      cmd = [tea_bin, "run", "--from-dot", dot_path,
             "--dot-exec", tea_bin,
             "--dot-max-parallel", str(max_parallel),
             "--dot-session", session_name]
      only_wave = state.get("only_wave")
      if only_wave:
          cmd += ["--dot-start-wave", str(only_wave)]
      if state.get("dry_run"):
          cmd += ["--dot-dry-run"]
      print("run_waves: " + " ".join(cmd))
      try:
          proc = subprocess.run(cmd, cwd=state.get("repo_path", "."),
                               capture_output=True, text=True, timeout=dot_timeout)
      except subprocess.TimeoutExpired:
          # O --from-dot não propaga SIGTERM pros nós em tmux → story-cycles órfãos.
          # Matar a session limpa os nós pendentes antes de reportar o timeout.
          subprocess.run(["tmux", "kill-session", "-t", session_name],
                         capture_output=True)
          print(f"run_waves: TIMEOUT após {dot_timeout}s — session tmux '{session_name}' morta.")
          return {"run_waves_results": {"rc": -1, "stdout": "", "stderr": f"timeout after {dot_timeout}s",
                                        "succeeded": [], "failed": [], "all_ok": False}}
      out = proc.stdout or ""
      err = proc.stderr or ""
      print(out[-3000:])
      if err:
          print("STDERR:", err[-1500:])
      # `Completed:`/`Failed:`/`Nodes:` vão pro STDERR do `tea --from-dot` (não stdout).
      # Parser precisa combinar ambos senão succeeded=[] e all_ok=False no piloto.
      combined = out + "\n" + err
      succeeded = re.findall(r'Completed:\s+(\S+)', combined)
      failed = re.findall(r'Failed:\s+(\S+)', combined)
      # "Nodes: N/M succeeded" indica sucesso total; rc==0 é requerido
      m_nodes = re.search(r'Nodes:\s+(\d+)/(\d+)\s+succeeded', combined)
      all_ok = bool(m_nodes) and m_nodes.group(1) == m_nodes.group(2) and proc.returncode == 0
      print(f"run_waves: rc={proc.returncode} succeeded={succeeded} failed={failed} all_ok={all_ok}")
      return {"run_waves_results": {"rc": proc.returncode, "stdout": out[-6000:], "stderr": err[-2000:],
                                    "succeeded": succeeded, "failed": failed, "all_ok": all_ok}}
    goto:
      - to: escalate_failed

  # ============================================================================
  # ESCALATE — porta a escalação de tier do JS. Uma story que o classificador colocou
  # um degrau abaixo do que precisava falha DUAS vezes no mesmo esforço fraco (o retry
  # do story-cycle repete com as mesmas opções) e, com stop_on_wave_failure, leva a
  # onda junto. Aqui ela é repromovida um degrau e tentada mais uma vez.
  #
  # Diferença deliberada em relação ao JS: lá a escalação para antes do tier de topo,
  # porque `frontier` é outro MODELO, com o dobro do preço. Aqui `frontier` é só o
  # esforço máximo — o mesmo que este workflow já usava por default — então promover
  # até ele é o comportamento antigo, não uma decisão cara.
  # ============================================================================
  - name: escalate_failed
    description: Repromove um tier as stories que falharam e tenta uma vez mais (só com auto_model)
    run: |
      import os, json, subprocess, tempfile, re
      from the_edge_agent.bmad_epic_waves_git import branch_tip

      res = dict(state.get("run_waves_results", {}) or {})
      worktrees = state.get("worktrees", []) or []
      tiers = dict(state.get("story_tiers", {}) or {})
      if not state.get("auto_model") or res.get("all_ok") or not worktrees or res.get("skipped"):
          return {"escalations": []}

      CHAIN = ["trivial", "small", "standard", "frontier"]
      providers = state.get("tier_providers") or {}
      payloads = state.get("dot_payloads", {}) or {}
      succeeded = list(res.get("succeeded") or [])
      failed = [w["key"] for w in worktrees if w["key"] not in succeeded]
      repo = os.path.realpath(state.get("repo_path", "."))
      target_branch = state.get("target_branch", "main")
      wtmap = {w["key"]: w for w in worktrees}

      plan = []
      for k in failed:
          t = tiers.get(k)
          if t not in CHAIN or CHAIN.index(t) == len(CHAIN) - 1:
              continue  # sem tier, ou já no topo: repetir no mesmo esforço não muda nada
          plan.append({"key": k, "from_tier": t, "to_tier": CHAIN[CHAIN.index(t) + 1]})
      if not plan:
          print(f"escalate_failed: {len(failed)} falha(s), nenhuma elegível a promoção de tier.")
          return {"escalations": []}

      lines = ['digraph escalate {', '  rankdir=TB;', '  node [shape=box];',
               '  Start [label="Start", shape=ellipse];', '  End [label="End", shape=ellipse];']
      for i, p in enumerate(plan):
          k = p["key"]
          wt = wtmap[k]
          payload = dict(payloads.get(k) or {})
          if not payload:
              print(f"  {k}: sem payload guardado — não dá para remontar o comando, pulando.")
              continue
          # Ancora a tentativa anterior antes de descartá-la. O JS ganha um worktree novo e
          # vazio a cada chamada; aqui a árvore é reusada, então "começar limpo" significa
          # jogar fora commits — e jogar fora sem deixar ref é destrutivo, não é higiene.
          tip = branch_tip(repo, wt["branch"])
          if tip:
              ref = f"refs/heads/attempt/{re.sub(r'[^A-Za-z0-9._-]+','-',k)}/{tip[:12]}"
              subprocess.run(["git","update-ref",ref,tip], cwd=repo, capture_output=True)
              print(f"  {k}: tentativa anterior preservada em {ref.removeprefix('refs/heads/')}")
          subprocess.run(["git","reset","--hard",target_branch], cwd=wt["path"], capture_output=True)
          subprocess.run(["git","clean","-fd"], cwd=wt["path"], capture_output=True)
          payload["dev_provider"] = providers.get(p["to_tier"], "codex")
          payload["story_tier"] = p["to_tier"]
          cmd = (f"cd {wt['path']} && {state.get('tea_bin')} run {state.get('subgraph_path')}"
                 f" --input '{json.dumps(payload)}'"
                 f" --fail-on-state 'final_status=incomplete'"
                 f" --fail-on-state 'final_status=missing_story_file'")
          cmd_dot = cmd.replace('\\', '\\\\').replace('"', '\\"')
          lines.append(f'  e{i} [label="{k}" command="{cmd_dot}"];')
          lines.append(f'  Start -> e{i};')
          lines.append(f'  e{i} -> End;')
          tiers[k] = p["to_tier"]
          print(f"  {k}: falhou no tier \"{p['from_tier']}\" — promovendo para \"{p['to_tier']}\" e tentando de novo.")
      lines.append('}')

      dot_dir = os.path.join(tempfile.gettempdir(), "tea-epic-waves")
      os.makedirs(dot_dir, exist_ok=True)
      dot_path = os.path.join(dot_dir, f"{state.get('epic_key','epic')}-escalate.dot")
      open(dot_path, "w").write("\n".join(lines))

      session = f"{state.get('epic_key','epic')}-escalate"
      cmd = [state.get("tea_bin"), "run", "--from-dot", dot_path,
             "--dot-exec", state.get("tea_bin"),
             "--dot-max-parallel", str(int(state.get("dot_max_parallel", 4))),
             "--dot-session", session]
      try:
          proc = subprocess.run(cmd, cwd=repo, capture_output=True, text=True,
                                timeout=int(state.get("dot_timeout", 86400)))
      except subprocess.TimeoutExpired:
          subprocess.run(["tmux","kill-session","-t",session], capture_output=True)
          print("escalate_failed: TIMEOUT — session tmux morta.")
          return {"escalations": plan, "story_tiers": tiers}
      combined = (proc.stdout or "") + "\n" + (proc.stderr or "")
      rescued = re.findall(r'Completed:\s+(\S+)', combined)
      print(f"escalate_failed: resgatadas {rescued} (rc={proc.returncode})")
      for k in rescued:
          if k not in succeeded: succeeded.append(k)
      res["succeeded"] = succeeded
      res["failed"] = [w["key"] for w in worktrees if w["key"] not in succeeded]
      res["all_ok"] = not res["failed"]
      return {"run_waves_results": res, "escalations": plan, "story_tiers": tiers}
    goto:
      - to: integrate_lock

  # ============================================================================
  # MERGE WORKTREES — serial, no branch alvo. Cada worktree commitou no branch
  # story/<key>; aqui fazemos `git merge` um de cada vez (serial → sem index.lock
  # e sem colisão no sprint-status, que nenhuma worktree tocou). Nível 1: conflito
  # de código → abort + merge_conflicts (fail-closed, pra revisão manual). Nível 2
  # (auto_resolve_conflicts): conflito → pending_resolution, resolve_conflicts (LLM)
  # junta os dois lados, verify_resolution (suíte verde + sem marcadores) decide.
  # ============================================================================
  - name: integrate_lock
    description: Toma o lock cross-run antes de merge/status/verify/retro no repo principal
    run: |
      from the_edge_agent.bmad_epic_waves_git import acquire_main_repo_lock
      if state.get("lock_owner"):
          return {}  # já temos (caminho sem PREP não passa por aqui duas vezes, mas é barato ser idempotente)
      r = acquire_main_repo_lock(state.get("repo_path", "."), wait_seconds=float(state.get("lock_wait_seconds", 2400)))
      print(f"integrate_lock: acquired={r['acquired']} reason={r['reason']}")
      return {"lock_owner": r["owner"] if r["acquired"] else "", "lock_reason": r["reason"]}
    goto:
      - if: "not state.get('lock_owner')"
        to: abort_lock_after_dev
      - to: merge_worktrees

  - name: abort_lock_after_dev
    description: Sem lock DEPOIS das stories rodarem — worktrees e branches ficam intactas
    run: |
      keys = [w["key"] for w in (state.get("worktrees", []) or [])]
      print("ABORT: não consegui o lock do repo principal para integrar. "
            f"NADA foi mergeado e as branches story/* seguem intactas: {keys}. "
            "Rode de novo quando a invocação irmã terminar — o merge é retomável.")
      return {"final_status": f"lock_{state.get('lock_reason','unknown')}", "merge_conflicts": keys}
    goto: __end__

  - name: merge_worktrees
    description: Mergea cada worktree no branch alvo com prova de commit e retenção fail-closed
    run: |
      import os, subprocess
      from the_edge_agent.bmad_epic_waves_git import (
          branch_has_unmerged_commits, is_ancestor, classify_conflict, heartbeat_main_repo_lock,
      )
      repo = os.path.realpath(state.get("repo_path", "."))
      if state.get("lock_owner"): heartbeat_main_repo_lock(repo, state["lock_owner"])
      worktrees = state.get("worktrees", []) or []
      auto_resolve = bool(state.get("auto_resolve_conflicts"))
      merged_ok, merge_conflicts, pending_resolution = [], [], []
      merged_tips, merged_branches = {}, {}
      conflict_audit = {}
      if not worktrees:
          print("merge_worktrees: nenhuma worktree — nada a mergear (dry_run ou 0 stories).")
          return {"merged_ok": [], "merged_tips": {}, "merged_branches": {},
                  "merge_conflicts": [], "pending_resolution": [], "post_merge_head": ""}
      cur = subprocess.run(["git","rev-parse","--abbrev-ref","HEAD"], cwd=repo, capture_output=True, text=True).stdout.strip()
      dirty = subprocess.run(["git","status","--porcelain"], cwd=repo, capture_output=True, text=True).stdout.strip()
      print(f"merge_worktrees: repo em '{cur}', dirty={bool(dirty)}, auto_resolve={auto_resolve}, {len(worktrees)} worktrees")
      if dirty:
          keys = [w["key"] for w in worktrees]
          print(f"merge_worktrees: FAIL-CLOSED — repo principal sujo; worktrees e branches mantidas: {keys}")
          head = subprocess.run(["git","rev-parse","HEAD"], cwd=repo, capture_output=True, text=True).stdout.strip()
          return {"merged_ok": [], "merged_tips": {}, "merged_branches": {},
                  "merge_conflicts": keys, "pending_resolution": [], "post_merge_head": head}
      for w in worktrees:
          k, branch, path = w["key"], w["branch"], w["path"]
          res = state.get("run_waves_results", {}) or {}
          succ = res.get("succeeded") or []
          if res.get("skipped") or k not in succ:
              print(f"  {k}: NÃO comprovada como succeeded no DOT — worktree e branch mantidas.")
              merge_conflicts.append(k)
              continue
          contributes, tip = branch_has_unmerged_commits(repo, branch)
          if not contributes:
              reason = "branch ausente" if not tip else "branch sem commits próprios além do HEAD alvo"
              print(f"  {k}: NÃO integrada — {reason}; worktree e branch mantidas.")
              merge_conflicts.append(k)
              continue
          pre_merge_head = subprocess.run(["git","rev-parse","HEAD"], cwd=repo, capture_output=True, text=True).stdout.strip()
          r = subprocess.run(["git","merge","--no-ff", branch, "-m", f"merge: story {k} (bmad-epic-waves)"],
                             cwd=repo, capture_output=True, text=True)
          if r.returncode == 0 and is_ancestor(repo, tip):
              merged_ok.append(k)
              merged_tips[k] = tip
              merged_branches[k] = branch
              print(f"  {k}: merged OK tip={tip[:8]}; branch retida até gate final")
              subprocess.run(["git","worktree","remove","--force",path], cwd=repo, capture_output=True)
          elif r.returncode == 0:
              reset = subprocess.run(["git","reset","--hard",pre_merge_head], cwd=repo, capture_output=True, text=True)
              print(f"  {k}: merge zero sem ancestralidade; rollback rc={reset.returncode}, worktree/branch mantidas.")
              merge_conflicts.append(k)
          else:
              conflicts = subprocess.run(["git","diff","--name-only","--diff-filter=U"], cwd=repo, capture_output=True, text=True).stdout.strip()
              files = [f for f in conflicts.splitlines() if f.strip()]
              # ELEGIBILIDADE MECÂNICA — decidida ANTES do `merge --abort`, enquanto os
              # estágios do índice ainda existem. Nada aqui olha os marcadores no disco:
              # sob o `merge.conflictStyle` default (2-way) eles mostram "cada lado
              # adicionou algo" mesmo quando as duas adições colidem em silêncio (a mesma
              # rota criada dos dois lados, dois arquivos novos de mesmo nome).
              verdict = classify_conflict(
                  repo, files,
                  test_command=state.get("test_command", ""),
                  protected_paths=[state.get("sprint_status_path", "")],
              ) if auto_resolve else {"eligible": False, "reason": "auto_resolve_off"}
              conflict_audit[k] = verdict
              subprocess.run(["git","merge","--abort"], cwd=repo, capture_output=True)
              if auto_resolve and verdict["eligible"]:
                  pending_resolution.append({"key": k, "branch": branch, "files": files, "tip": tip})
                  print(f"  {k}: CONFLITO add/add puro ({len(files)} arq, {verdict['reason']}) → pending_resolution; branch mantida.")
                  subprocess.run(["git","worktree","remove","--force",path], cwd=repo, capture_output=True)
              else:
                  merge_conflicts.append(k)
                  why = verdict["reason"] if auto_resolve else "auto_resolve_conflicts=false"
                  print(f"  {k}: CONFLITO NÃO auto-resolvível ({why}) — decisão humana. Worktree/branch mantidas. stderr: {r.stderr.strip()[:200]}")
      post_merge_head = subprocess.run(["git","rev-parse","HEAD"], cwd=repo, capture_output=True, text=True).stdout.strip()
      print(f"merge_worktrees: {len(merged_ok)} merged, {len(merge_conflicts)} falha/conflito(N1), {len(pending_resolution)} pending(N2). post_merge_head={post_merge_head[:8]}")
      return {"merged_ok": merged_ok, "merged_tips": merged_tips,
              "merged_branches": merged_branches, "merge_conflicts": merge_conflicts,
              "pending_resolution": pending_resolution, "post_merge_head": post_merge_head,
              "conflict_audit": conflict_audit}
    goto:
      - if: "state.get('pending_resolution')"
        to: resolve_conflicts
      - to: migration_dag

  # ============================================================================
  # RESOLVE CONFLICTS (Nível 2) — LLM re-mergea cada pending_resolution e junta os
  # dois lados dos conflitos (preserva AMBOS, nunca remove). Só atua em arquivos
  # listados em pending_resolution[i].files. Deixa marcadores intactos se o
  # conflito for semanticamente incompatível (FAILED).
  # ============================================================================
  - name: resolve_conflicts
    description: Re-mergea cada pending_resolution e resolve conflitos via LLM (juntar ambos os lados, nunca remover)
    uses: llm.call
    with:
      provider: shell
      shell_provider: codex
      model: "{{ state.dev_model | default('gpt-5.6-sol') }}"
      timeout: 3600
      messages:
        - role: user
          content: |
            Você é um sub-agente sem contexto prévio, no repo principal em {{ state.repo_path }} (branch alvo). Comunique-se em {{ state.communication_language }}. Usuário: {{ state.user_name }}.

            ⚠️ **HIGIENE DE CREDENCIAL.** Credencial real (senha de banco, API key, token de pod/secret) nunca vai para arquivo nem para a sua saída — só inline, no único comando que a consome. Se não der, PARE e reporte o bloqueio.

            O bmad-epic-waves mergeou em serial N stories que chocaram em arquivos compartilhados. Cada conflito abaixo já passou por uma checagem MECÂNICA (estágios do índice, diffs insertion-only dos dois lados, nenhuma interseção de identificadores, nenhum arquivo gerado/lock/sprint-status) — ou seja, são colisões add/add puras. Você vai resolver o que o git não conseguiu, **juntando** as duas versões (NÃO escolhendo um lado).

            Pendentes a resolver (cada um é um branch `story/<key>` já commitado, cujo `git merge --no-ff` deu conflito):
            {% for p in state.pending_resolution %}
            - key: {{ p.key }}, branch: {{ p.branch }}, arquivos conflitantes:
            {% for f in p.files %}    - {{ f }}
            {% endfor %}{% endfor %}

            Para CADA pendente, em ordem:
            1. Rode `git merge --no-ff <branch>` (use o branch listado; vai conflitar de novo nos arquivos). NÃO use `-X ours`/`-X theirs`/`--strategy-option`.
            2. Para cada arquivo conflitante: localize os blocos `<<<<<<< HEAD` ... `=======` ... `>>>>>>> story/<key>`. **Junte as duas versões preservando AMBOS os lados**: linhas que aparecem só num lado entram; linhas idênticas nos dois lados entram uma vez. Remova os marcadores `<<<<<<<`/`=======`/`>>>>>>>`.
            3. **NUNCA remova conteúdo que existia em qualquer dos lados** — só junta. Se o conflito é semanticamente incompatível (mesma linha/constante com valores mutuamente exclusivos que NÃO podem coexistir), **NÃO resolva**: deixe os marcadores intactos e reporte este key como `FAILED`.
            4. Se resolveu TODOS os arquivos do key: `git add <arquivos>` (nominais, NUNCA `git add -A`/`.`) e `git commit --no-edit` (completa o merge em andamento — NÃO use `git merge`, que dá erro fatal quando já há um MERGE_HEAD).
            5. Reporte `<key>: RESOLVED` ou `<key>: FAILED` (uma linha por key, no final).

            Restrições: NÃO rode testes, NÃO edite `{{ state.sprint_status_path }}`, NÃO toque arquivos fora da lista de conflitantes de cada key, NUNCA `git add -A`/`.`/`--all`.

            Imprima ao final `RESOLUTION_DONE`.
    output: resolution_output
    goto:
      - to: verify_resolution

  # ============================================================================
  # VERIFY RESOLUTION (Nível 2) — gate de segurança determinístico. Se o LLM
  # deixou marcadores (FAILED) ou a suíte ficou vermelha, fail-closed:
  # git reset --hard post_merge_head (preserva os merged_ok originais do
  # merge_worktrees) + pendentes viram merge_conflicts.
  # ============================================================================
  - name: verify_resolution
    description: Gate Nível 2 — ancestralidade, marcadores, suíte e rollback recuperável
    run: |
      import os, re, subprocess
      from the_edge_agent.bmad_epic_waves_git import branch_tip, preserve_resolution_head, reconcile_merged_keys
      repo = os.path.realpath(state.get("repo_path", "."))
      text = state.get("resolution_output", {})
      text = text.get("content", "") if isinstance(text, dict) else (str(text) if text else "")
      pending = state.get("pending_resolution", []) or []
      pending_keys = [p["key"] for p in pending]
      post_merge_head = state.get("post_merge_head", "")
      resolved = [k for k in pending_keys if re.search(rf'^{re.escape(k)}:\s*RESOLVED', text, re.M)]
      failed = [k for k in pending_keys if k not in resolved]
      d = subprocess.run(["git","diff","--name-only","--diff-filter=U"], cwd=repo, capture_output=True, text=True).stdout.strip()
      conflict_files = sorted({f for p in pending for f in p.get("files", [])})
      marker_cmd = ["git","grep","-n","-E",r"^(<<<<<<< |=======|>>>>>>> )","HEAD","--",*conflict_files]
      marker_scan = subprocess.run(marker_cmd, cwd=repo, capture_output=True, text=True) if conflict_files else None
      committed_markers = marker_scan.stdout.strip() if marker_scan and marker_scan.returncode == 0 else ""
      print(f"verify_resolution: resolved={resolved} failed={failed} conflicted='{d}' committed_markers={'SIM' if committed_markers else 'nao'}")
      merged_ok = list(state.get("merged_ok", []) or [])
      merged_tips = dict(state.get("merged_tips", {}) or {})
      merged_branches = dict(state.get("merged_branches", {}) or {})
      merge_conflicts = list(state.get("merge_conflicts", []) or [])

      def fail_closed(reason):
          before = branch_tip(repo, "HEAD")
          recovery = preserve_resolution_head(repo, state.get("epic_key", "epic"), pending_keys)
          needs_anchor = bool(before and post_merge_head and before != post_merge_head)
          if needs_anchor and set(recovery) != set(pending_keys):
              for key in pending_keys:
                  if key not in merge_conflicts: merge_conflicts.append(key)
              print(f"verify_resolution: CRÍTICO — refs de recuperação incompletas; reset recusado: {recovery}")
              return {"merged_ok": merged_ok, "merged_tips": merged_tips,
                      "merged_branches": merged_branches, "merge_conflicts": merge_conflicts,
                      "resolution_recovery": recovery, "rollback_ok": False}
          if d:
              subprocess.run(["git","merge","--abort"], cwd=repo, capture_output=True)
          reset = subprocess.run(["git","reset","--hard",post_merge_head], cwd=repo, capture_output=True, text=True) if post_merge_head else None
          after = branch_tip(repo, "HEAD")
          rollback_ok = bool(post_merge_head and reset and reset.returncode == 0 and after == post_merge_head)
          for key in pending_keys:
              if key not in merge_conflicts: merge_conflicts.append(key)
          print(f"verify_resolution: {reason} → fail-closed rollback_ok={rollback_ok}; recovery={recovery}")
          return {"merged_ok": merged_ok, "merged_tips": merged_tips,
                  "merged_branches": merged_branches, "merge_conflicts": merge_conflicts,
                  "resolution_recovery": recovery, "rollback_ok": rollback_ok}

      if d or committed_markers or failed:
          return fail_closed("GATE 1 FALHOU")
      pending_tips = {p["key"]: p.get("tip", "") for p in pending}
      accepted, rejected = reconcile_merged_keys(repo, resolved, pending_tips)
      if rejected:
          return fail_closed(f"GATE DE ANCESTRALIDADE FALHOU para {rejected}")
      expected_head = branch_tip(repo, "HEAD")
      test_cmd = state.get("test_command", "make test")
      print(f"verify_resolution: rodando suíte '{test_cmd}'")
      try:
          t = subprocess.run(test_cmd, shell=True, cwd=repo, capture_output=True, text=True, timeout=float(state.get("resolution_test_timeout", 3600)))
      except Exception as exc:
          return fail_closed(f"suíte não concluiu: {type(exc).__name__}: {exc}")
      print(t.stdout[-1500:])
      if t.returncode != 0:
          print(t.stderr[-1000:])
          return fail_closed(f"suíte VERMELHA (rc={t.returncode})")
      if branch_tip(repo, "HEAD") != expected_head:
          return fail_closed("HEAD mudou durante a suíte")
      accepted, rejected = reconcile_merged_keys(repo, resolved, pending_tips)
      if rejected:
          return fail_closed(f"ancestralidade mudou após suíte: {rejected}")
      print("verify_resolution: suíte VERDE + ancestralidade comprovada")
      merged_ok.extend(accepted)
      merged_tips.update({key: pending_tips[key] for key in accepted})
      merged_branches.update({p["key"]: p["branch"] for p in pending if p["key"] in accepted})
      return {"merged_ok": merged_ok, "merged_tips": merged_tips,
              "merged_branches": merged_branches, "merge_conflicts": merge_conflicts,
              "resolution_recovery": {}, "rollback_ok": True}
    goto:
      - to: migration_dag

  # ============================================================================
  # MIGRATION DAG — o merge limpo é exatamente onde esta classe de bug se esconde: duas
  # migrations irmãs criadas a partir do MESMO pai por stories diferentes mergeiam
  # textualmente limpas (nomes de arquivo distintos) e deixam a checagem de consistência
  # do próprio framework quebrada. Só age quando a saída NOMEIA literalmente migrations
  # conflitantes / múltiplas folhas: o mesmo comando falha por motivos não relacionados
  # (drift de model, settings ruim, banco inacessível) e improvisar neles escreveria
  # migrations que ninguém pediu.
  # ============================================================================
  - name: migration_dag
    description: Detecta e resolve múltiplas folhas de migration com o gerador do próprio framework
    run: |
      import os, subprocess
      from the_edge_agent.bmad_epic_waves_git import (
          find_django_manage, check_migration_heads, merge_migration_heads, heartbeat_main_repo_lock,
      )
      repo = os.path.realpath(state.get("repo_path", "."))
      if state.get("lock_owner"): heartbeat_main_repo_lock(repo, state["lock_owner"])
      if not state.get("merged_ok"):
          return {"migration_fix": {"ran": False, "reason": "nada mergeado nesta rodada"}}
      manage = find_django_manage(repo)
      if not manage:
          return {"migration_fix": {"ran": False, "reason": "manage.py não encontrado (projeto não-Django ou fora do alcance)"}}
      check = check_migration_heads(repo, manage)
      if not check.get("multiple_heads"):
          print(f"migration_dag: {manage} — sem múltiplas folhas (rc={check.get('returncode')}).")
          return {"migration_fix": {"ran": True, "multiple_heads": False, "manage": manage}}
      print(f"migration_dag: múltiplas folhas detectadas via {manage}:\n{check['output'][-600:]}")
      merged = merge_migration_heads(repo, manage)
      if not merged["ok"] or not merged["created"]:
          print(f"migration_dag: NÃO consegui resolver automaticamente — deixando para revisão humana:\n{merged['output'][-600:]}")
          return {"migration_fix": {"ran": True, "multiple_heads": True, "resolved": False,
                                    "manage": manage, "output": merged["output"][-1500:]}}
      # git add NOMINAL do que o gerador criou; nunca -A, o repo pode ter resto de outra sessão.
      created = [c for c in merged["created"] if os.path.isfile(os.path.join(repo, c))] or []
      add_targets = created or [os.path.dirname(manage) or "."]
      subprocess.run(["git","add"] + add_targets, cwd=repo, capture_output=True)
      staged = subprocess.run(["git","diff","--cached","--name-only"], cwd=repo, capture_output=True, text=True).stdout.strip()
      if not staged:
          print("migration_dag: gerador rodou mas nada ficou staged — nada a commitar.")
          return {"migration_fix": {"ran": True, "multiple_heads": True, "resolved": False, "manage": manage}}
      c = subprocess.run(["git","commit","-m","fix(migrations): merge conflicting leaf migrations"],
                         cwd=repo, capture_output=True, text=True)
      ok = c.returncode == 0
      print(f"migration_dag: merge de migrations {'commitado' if ok else 'FALHOU'} ({staged.splitlines()})")
      return {"migration_fix": {"ran": True, "multiple_heads": True, "resolved": ok,
                                "manage": manage, "files": staged.splitlines()}}

  # ============================================================================
  # MARK DONE — serial, determinístico (porta o mergePrompt de sprint-status)
  # ============================================================================
  - name: mark_done
    description: Marca apenas stories cuja tip comprovadamente está no HEAD final e commita por nome
    run: |
      import os, re, subprocess, yaml
      from datetime import date
      from the_edge_agent.bmad_epic_waves_git import reconcile_merged_keys, heartbeat_main_repo_lock
      repo = state.get("repo_path", ".")
      if state.get("lock_owner"): heartbeat_main_repo_lock(repo, state["lock_owner"])
      ss_rel = state.get("sprint_status_path", "_bmad-output/implementation-artifacts/sprint-status.yaml")
      ss_full = os.path.join(repo, ss_rel)
      today = date.today().isoformat()
      marked = []
      if not os.path.isfile(ss_full):
          print("sprint-status.yaml ausente — pulando mark_done")
          return {"marked_done": []}
      with open(ss_full) as f:
          lines = f.readlines()
      merged_ok = list(state.get("merged_ok", []) or [])
      merged_tips = dict(state.get("merged_tips", {}) or {})
      accepted, rejected = reconcile_merged_keys(repo, merged_ok, merged_tips)
      merge_conflicts = list(state.get("merge_conflicts", []) or [])
      for key in rejected:
          if key not in merge_conflicts:
              merge_conflicts.append(key)
      if rejected:
          print(f"mark_done: removidas de merged_ok por falha de ancestralidade: {rejected}")
      keys = [c["key"] for c in state.get("candidates", []) if c["key"] in accepted]
      if not keys:
          print("mark_done: nenhuma story integrada e comprovada — nada a marcar.")
          return {"marked_done": [], "merged_ok": accepted, "merge_conflicts": merge_conflicts}
      new_lines = []
      for ln in lines:
          m = re.match(r'^(\s*)([A-Za-z0-9_-]+):\s*(.+)$', ln)
          if m and m.group(2) in keys:
              indent, key, rest = m.group(1), m.group(2), m.group(3)
              comment = ""
              if '#' in rest: comment = " " + rest[rest.index('#'):]
              new_lines.append(f'{indent}{key}: done{comment}\n')
              marked.append(key)
          else:
              new_lines.append(ln)
      out = []
      for ln in new_lines:
          out.append(f'last_updated: {today}\n' if re.match(r'^\s*last_updated:\s*.*$', ln) else ln)
      with open(ss_full, "w") as f:
          f.writelines(out)
      yaml.safe_load(open(ss_full))
      subprocess.run(["git","add", ss_rel], cwd=repo, check=True)
      r = subprocess.run(["git","commit","-m", f"chore(sprint): {state.get('epic_key')} wave -> done"], cwd=repo, capture_output=True, text=True)
      if r.returncode != 0 and "nothing to commit" not in (r.stdout + r.stderr).lower():
          subprocess.run(["git","restore","--staged","--worktree",ss_rel], cwd=repo, capture_output=True)
          for key in accepted:
              if key not in merge_conflicts: merge_conflicts.append(key)
          print(f"mark_done commit falhou; status revertido: {r.stderr}")
          return {"marked_done": [], "merged_ok": [], "merge_conflicts": merge_conflicts}
      print(f"Marcadas done: {marked}")
      return {"marked_done": marked, "merged_ok": accepted, "merge_conflicts": merge_conflicts}

  # ============================================================================
  # VERIFY — determinístico + suite coverage
  # ============================================================================
  - name: verify_epic
    description: Confere all_done no sprint-status e roda a suíte (porta verifyPrompt)
    run: |
      import os, re, subprocess, yaml
      repo = state.get("repo_path", ".")
      ss_full = os.path.join(repo, state.get("sprint_status_path", "_bmad-output/implementation-artifacts/sprint-status.yaml"))
      epic_num, epic_key = state.get("epic_num",""), state.get("epic_key","")
      done = total = 0
      multi = state.get("multi_epic", False)
      cand_keys = {c["key"] for c in state.get("candidates", [])}
      if os.path.isfile(ss_full):
          ss = yaml.safe_load(open(ss_full)) or {}
          for key, val in (ss.get("development_status", {}) or {}).items():
              if multi:
                  # no multi-épico, conta só as stories candidatas deste run
                  if key not in cand_keys: continue
              else:
                  if not re.match(rf'^{epic_num}-', key): continue
                  if key in (epic_key, f"{epic_key}-retrospective"): continue
              total += 1
              st = val if isinstance(val, str) else (val.get("status") if isinstance(val, dict) else str(val))
              if (st or "").lower() == "done": done += 1
      merge_conflicts = state.get("merge_conflicts", []) or []
      suite_green = False
      tc = state.get("test_command", "")
      if tc:
          try:
              r = subprocess.run(tc, shell=True, cwd=repo, capture_output=True, text=True, timeout=1800)
              suite_green = r.returncode == 0
              if not suite_green:
                  print(f"Suíte NÃO verde:\n{r.stdout[-800:]}\n{r.stderr[-800:]}")
          except Exception as e:
              print(f"Suíte não roda: {e}")

      # A SUÍTE COBRE ESTE ÉPICO? `suite_green` sozinho é instrumento cego: num épico real
      # a suíte declarada não coletava o diretório onde o épico inteiro morava, e o booleano
      # saiu verde sobre uma árvore vazia. A versão checável da pergunta é: esta rodada
      # entregou arquivos de teste que a suíte configurada NÃO coleta?
      from the_edge_agent.bmad_epic_waves_git import suite_covers_paths
      base = state.get("run_base_head") or ""
      touched = []
      if base:
          dr = subprocess.run(["git","diff","--name-only",f"{base}..HEAD"], cwd=repo, capture_output=True, text=True)
          touched = [f for f in dr.stdout.splitlines() if f.strip()]
      cov = suite_covers_paths(repo, touched)
      suite_covers = cov["covers"]
      suite_that_covers = ""
      if suite_covers is False:
          suite_that_covers = f"testes entregues fora do escopo declarado ({cov['roots']}): {cov['uncovered'][:10]}"
          print(f"⚠️  suite_green={suite_green} MAS a suíte não coleta os testes entregues — o verde não prova nada sobre este épico. {suite_that_covers}")
      elif touched and not cov["touched_tests"]:
          suite_that_covers = f"a rodada mexeu em {len(touched)} arquivo(s) e não entregou nenhum arquivo de teste"
          print(f"⚠️  {suite_that_covers} — o verde da suíte não fala sobre este código.")

      incomplete_keys = sorted(set(cand_keys) - set(state.get("marked_done", []) or []))
      incomplete_keys = sorted(set(incomplete_keys) | set(merge_conflicts))
      all_done = total > 0 and done == total and not incomplete_keys and suite_green
      if all_done:
          for branch in (state.get("merged_branches", {}) or {}).values():
              subprocess.run(["git","branch","-D",branch], cwd=repo, capture_output=True)
      print(f"Verify: {done}/{total} done, suite_green={suite_green}, cobre_o_epico={suite_covers}, incomplete={incomplete_keys}, all_done={all_done}")
      return {"all_done": all_done, "done_count": done, "total_count": total,
              "suite_green": suite_green, "incomplete_keys": incomplete_keys,
              "suite_covers_the_epic": bool(suite_covers) if suite_covers is not None else True,
              "suite_that_covers": suite_that_covers}

  # ============================================================================
  # RETRO — condicional (porta retroPrompt, com flip do epic-N)
  # ============================================================================
  - name: decide_retro
    description: Decide se dispara retrospective + flip
    run: |
      run_retro = (state.get("run_retrospective", True)
                   and state.get("all_done", False)
                   and not state.get("only_wave")
                   and not state.get("dry_run")
                   and not state.get("multi_epic", False))  # retro é per-épico; multi pula
      print(f"Retrospective: {'vai rodar' if run_retro else 'pulada'}")
      return {"_run_retro": run_retro}
    goto:
      - if: "state.get('_run_retro')"
        to: retro_run
      - to: summary

  - name: retro_run
    description: Escreve a retro, flippa epic-N para done, 2 commits separados (porta retroPrompt)
    uses: llm.call
    with:
      provider: shell
      shell_provider: codex
      model: "{{ state.dev_model | default('gpt-5.6-sol') }}"
      timeout: 3600
      messages:
        - role: user
          content: |
            Você é um sub-agente sem contexto prévio, no repo real em {{ state.repo_path }}. Todas as stories do {{ state.epic_key }} ("{{ state.epic_label }}") estão "done" em `{{ state.sprint_status_path }}` e já foram mergeadas em `{{ state.target_branch }}`. Comunique-se em {{ state.communication_language }}; doc em {{ state.document_output_language }}. Usuário: {{ state.user_name }}.

            **STEP 0 — NÃO DUPLIQUE.** Antes de tudo, procure retro existente (`*{{ state.epic_key }}*retro*` em `{{ state.implementation_artifacts_dir }}/`) e confira se `development_status["{{ state.epic_key }}"]` já é "done".
            - Se AMBOS já existem: **não escreva nem commita nada.** Retorne ok=true, epicFlipped=false, e explique que já estava fechado.
            - Se só um existe: faça **só a parte faltante**.

            Siga o espírito de `{{ state.skills_dir }}/bmad-retrospective/SKILL.md`, modo não-interativo (sem "party mode", sem perguntas).

            **ANTES DE ESCREVER, REÚNA EVIDÊNCIA:**
            - Leia as retros anteriores do repo (`*retro*` em implementation-artifacts) e **siga o formato da mais recente**. Não invente estrutura.
            - Leia os Dev Agent Records e follow-up/debt de cada story do épico.
            - `git log --oneline` sobre o range do épico e `git diff --stat` p/ métricas.
            - Se houver doc de test-design/risk do épico, compare previstos vs. materializados.

            ⚠️ **HIGIENE DE CREDENCIAL.** Credencial real nunca vai para arquivo nem para a sua saída — só inline, no único comando que a consome. Se não der, PARE e reporte o bloqueio.

            **Fatos desta run que a retro deve incorporar:**
            - Ondas executadas: {{ state.waves }}
            - Verify: {{ state.done_count }}/{{ state.total_count }} done · suíte {{ 'VERDE' if state.suite_green else 'NÃO verde' }} · **a suíte cobre o épico: {{ 'sim' if state.suite_covers_the_epic else 'NÃO' }}**{% if state.suite_that_covers %} · {{ state.suite_that_covers }}{% endif %}
            - Stories marcadas done: {{ state.marked_done }}
            {% if state.blocked_stories %}- Stories NÃO despachadas por dependência cross-épico: {{ state.blocked_stories }}
            {% endif %}{% if state.escalations %}- Stories repromovidas de tier após falha: {{ state.escalations }}
            {% endif %}{% if state.migration_fix and state.migration_fix.get('multiple_heads') %}- DAG de migrations: múltiplas folhas detectadas e {{ 'resolvidas automaticamente' if state.migration_fix.get('resolved') else 'NÃO resolvidas (revisão humana)' }}.
            {% endif %}{% if not state.suite_covers_the_epic %}- ⚠️ A suíte declarada NÃO exercita o código deste épico. Isso é material de retro por si só: nomeie a dívida de cobertura explicitamente, não deixe implícita num rodapé.
            {% endif %}

            **O documento precisa ter** (adapte às seções da retro anterior):
            1. Métricas de entrega — stories, commits/SHAs, ciclos de review por story, movimento da suíte, conflitos de merge. Números.
            2. O que funcionou — ancorado em verificável.
            3. A lição principal — classe de problema, não incidente.
            4. Dívidas e perguntas em aberto, NOMEADAS.
            5. Preparação p/ o próximo épico — recomendações concretas. Sem estimativas de tempo.

            **Não adoce.** Se entregou menos que prometido, se um AC foi contornado, se a cobertura é cega — escreva.

            **Ao terminar, faça DOIS commits separados** (`git add <arquivo>` por nome, **nunca** `git add -A`/`.`):
            1. O documento de retro, em `{{ state.implementation_artifacts_dir }}/` com o mesmo padrão de nome das anteriores. Mensagem: `docs({{ state.epic_key }}): retrospective`.
            {% if state.flip_epic_status %}2. **FLIP de status** em `{{ state.sprint_status_path }}`:
               - `development_status["{{ state.epic_key }}"] = "done"` (hoje está in-progress/backlog).
               - `development_status["{{ state.epic_key }}-retrospective"] = "done"`, com comentário na mesma linha citando o arquivo de retro e a lição principal em meia linha. Se essa key não existe, não invente — reporte nas notas.
               - `last_updated` = hoje, com novo headline descrevendo o fechamento + dívidas em aberto. **PRESERVE o headline anterior** movendo-o para uma linha `# Previous: <date> — <text>` logo abaixo (padrão deste arquivo).
               - Antes de commitar, valide que o YAML ainda parseia e que a contagem de keys de `development_status` é a mesma.
               - Commit só esse arquivo (`git add <path>`, nunca -A): mensagem `chore(sprint): {{ state.epic_key }} -> done + retrospective`.
            {% else %}2. **NÃO toque o status do épico** (flipEpicStatus=false). Reporte epicFlipped=false.{% endif %}

            Imprima `RETRO_DONE: <path>` e `EPIC_FLIPPED: true|false` ao final.
    output: retro_output

  - name: summary
    description: Relatório final do épico
    run: |
      from the_edge_agent.bmad_epic_waves_git import release_main_repo_lock
      # Solta o lock ANTES de imprimir: uma invocação irmã esperando não deve ficar presa
      # atrás da formatação de um relatório.
      if state.get("lock_owner"):
          released = release_main_repo_lock(state.get("repo_path", "."), state["lock_owner"])
          if not released:
              print("⚠️  lock não liberado: o token de dono não confere mais — algo o reivindicou como parado. Não removi (seria apagar o lock de um irmão vivo).")
      suite = "VERDE" if state.get("suite_green") else "NÃO verde"
      if state.get("suite_green") and not state.get("suite_covers_the_epic", True):
          suite = "VERDE mas NÃO cobre o épico"
      retro = "rodou" if state.get("_run_retro") else "pulada"
      incomplete = ", ".join(state.get("incomplete_keys", []) or []) or "nenhuma"
      print(f"""
      ╔════════════════════════════════════════════════════════════╗
      ║         BMAD EPIC-WAVES — ÉPICO CONCLUÍDO                  ║
      ╠════════════════════════════════════════════════════════════╣
      ║ Épico: {state.get('epic_key','?'):<53} ║
      ║ Label: {state.get('epic_label','?'):<53} ║
      ║ Ondas: {len(state.get('waves',[])):<54} ║
      ║ Verify: {state.get('done_count',0)}/{state.get('total_count',0)} done — all_done={str(state.get('all_done',False)):<27} ║
      ║ Suíte: {suite:<48} ║
      ║ Retrospective: {retro:<48} ║
      ╚════════════════════════════════════════════════════════════╝
      """)
      print(f"Stories não integradas: {incomplete}")
      blocked = state.get("blocked_stories", []) or []
      if blocked:
          print(f"Bloqueadas por dependência cross-épico (nenhum agente gasto): {', '.join(blocked)}")
          for b in state.get("external_blockers", []) or []:
              print(f"  {b['story']} precisa de {b['requires_key']} (hoje \"{b['current_status']}\")")
      for key, verdict in (state.get("conflict_audit", {}) or {}).items():
          if not verdict.get("eligible"):
              print(f"Conflito não auto-resolvível em {key}: {verdict.get('reason')}")
      esc = state.get("escalations", []) or []
      if esc:
          print("Tiers repromovidos após falha: " + ", ".join(f"{e['key']} {e['from_tier']}->{e['to_tier']}" for e in esc))
      mf = state.get("migration_fix") or {}
      if mf.get("multiple_heads"):
          print(f"DAG de migrations: múltiplas folhas — {'resolvidas' if mf.get('resolved') else 'NÃO resolvidas, revisão humana'}")
      if state.get("suite_that_covers"):
          print(f"Cobertura da suíte: {state.get('suite_that_covers')}")
      final = "completed" if state.get("all_done") else "incomplete"
      return {"final_status": final, "epic": state.get("epic_key"), "lock_owner": ""}

# Só os nós SEM `goto` aparecem aqui: `goto` tem precedência sobre esta seção, e declarar
# os dois para o mesmo nó só cria aresta morta que confunde quem lê o grafo.
edges:
  - from: __start__
    to: discover_epic
  - from: prep_create
    to: prep_lock
  - from: prep_reconcile
    to: parse_reconcile
  - from: graph_llm
    to: build_waves
  - from: migration_dag
    to: mark_done
  - from: mark_done
    to: verify_epic
  - from: verify_epic
    to: decide_retro
  - from: retro_run
    to: summary
  - from: summary
    to: __end__
